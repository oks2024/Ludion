# Ludion's fork of parry3d 0.30.2: the crates.io release's normalized manifest, renamed `ludion-parry3d` (the lib
# keeps the name `parry3d`) so the patched crate can be published beside Ludion. Its features are cut to
# the set Ludion builds, so `--all-features` is exactly what ships; upstream's test, bench and
# example targets are not built. What changed and why: LUDION-PATCH.md.

[package]
edition = "2021"
name = "ludion-parry3d"
version = "0.30.2"
authors = ["Sébastien Crozet <developer@crozet.re>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "3 dimensional collision detection library in Rust (parry3d 0.30.2 with Ludion's patch)."
homepage = "https://parry.rs"
documentation = "https://docs.rs/ludion-parry3d"
readme = "README.md"
keywords = [
    "collision",
    "geometry",
    "distance",
    "ray",
    "convex",
]
categories = [
    "science",
    "game-development",
    "mathematics",
    "wasm",
]
license = "Apache-2.0"
repository = "https://github.com/oks2024/Ludion"

[package.metadata.docs.rs]
features = ["enhanced-determinism", "parallel", "serde-serialize"]

[badges.maintenance]
status = "actively-developed"

[features]
alloc = ["hashbrown", "smallvec", "downcast-rs", "rstar", "glamx/approx"]
default = ["required-features", "std"]
dim3 = []
enhanced-determinism = ["simba/libm_force", "indexmap", "glamx/libm", "glamx/scalar-math"]
f32 = []
parallel = ["rayon"]
required-features = ["dim3", "f32"]
serde-serialize = ["serde", "serde_arrays", "glamx/serde", "bitflags/serde", "hashbrown?/serde"]
std = ["glamx/std", "slab", "simba/std", "arrayvec/std", "thiserror/std", "ena"]

[lib]
name = "parry3d"
path = "src/lib.rs"
test = false
doctest = false
required-features = ["required-features"]

[dependencies.approx]
version = "0.5"
default-features = false

[dependencies.arrayvec]
version = "0.7"
default-features = false

[dependencies.bitflags]
version = "2.3"

[dependencies.downcast-rs]
version = "2"
features = ["sync"]
optional = true
default-features = false

[dependencies.either]
version = "1"
default-features = false

[dependencies.ena]
version = "0.14.3"
optional = true
default-features = false

[dependencies.foldhash]
version = "0.2"
default-features = false

[dependencies.glamx]
version = "0.3"
features = [
    "nostd-libm",
    "i32",
]
default-features = false

[dependencies.hashbrown]
version = "0.17"
features = ["default-hasher"]
optional = true
default-features = false

[dependencies.indexmap]
version = "2"
features = ["serde"]
optional = true

[dependencies.log]
version = "0.4"

[dependencies.num-derive]
version = "0.4"

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.ordered-float]
version = "5"
default-features = false

[dependencies.rayon]
version = "1"
optional = true

[dependencies.rstar]
version = "0.13.0"
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]
optional = true

[dependencies.serde_arrays]
version = "0.2"
optional = true

[dependencies.simba]
version = "0.10.1"
features = ["wide"]
default-features = false

[dependencies.slab]
version = "0.4"
optional = true

[dependencies.smallvec]
version = "1"
optional = true

[dependencies.static_assertions]
version = "1"

[dependencies.thiserror]
version = "2"
default-features = false

[lints.clippy]
all = { level = "allow", priority = -1 }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(feature, values("bytemuck", "bytemuck-serialize", "improved_fixed_point_support", "rkyv", "simd8", "spade"))',
    'cfg(feature, values("dim2", "dim3", "f32", "f64"))',
    'cfg(feature, values("wavefront"))',
    'cfg(feature, values("encase"))',
    'cfg(target_arch, values("spirv"))',
]

