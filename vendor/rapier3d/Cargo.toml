# Ludion's fork of rapier3d 0.35.3: the crates.io release's normalized manifest, renamed `ludion-rapier3d` (the lib
# keeps the name `rapier3d`) so the patched crate can be published beside Ludion. Its features are cut to
# the set Ludion builds, so `--all-features` is exactly what ships; upstream's test, bench and
# example targets are not built. What changed and why: LUDION-PATCH.md.

[package]
edition = "2024"
rust-version = "1.86"
name = "ludion-rapier3d"
version = "0.35.3"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "3-dimensional physics engine in Rust (rapier3d 0.35.3 with Ludion's patches)."
homepage = "https://rapier.rs"
documentation = "https://docs.rs/ludion-rapier3d"
readme = "README.md"
keywords = [
    "physics",
    "dynamics",
    "rigid",
    "real-time",
    "impulse_joints",
]
categories = [
    "science",
    "game-development",
    "mathematics",
    "simulation",
    "wasm",
]
license = "Apache-2.0"
repository = "https://github.com/oks2024/Ludion"

[package.metadata.docs.rs]
features = ["enhanced-determinism", "parallel", "serde-serialize"]

[badges.maintenance]
status = "actively-developed"

[features]
alloc = ["nalgebra/alloc", "parry3d/alloc", "serde?/alloc"]
default = ["dim3", "f32", "std"]
dim3 = []
enhanced-determinism = ["simba/libm_force", "parry3d/enhanced-determinism"]
f32 = []
parallel = ["dep:rayon", "std", "parry3d/parallel"]
profiler = ["dep:web-time"]
serde-serialize = ["arrayvec/serde", "nalgebra/serde-serialize", "parry3d/serde-serialize", "dep:serde", "std"]
std = ["alloc", "parry3d/std", "nalgebra/std", "simba/std", "num-traits/std", "approx/std", "thiserror/std", "wide/std", "serde?/std"]

[lib]
name = "rapier3d"
path = "src/lib.rs"
test = false
doctest = false
required-features = [
    "dim3",
    "f32",
]

[dependencies.approx]
version = "0.5"
default-features = false

[dependencies.arrayvec]
version = "0.7"
default-features = false

[dependencies.bitflags]
version = "2"

[dependencies.glamx]
version = "0.3"
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.parry3d]
package = "ludion-parry3d"
version = "0.30.2"
path = "../parry3d"
features = ["required-features"]
default-features = false

[dependencies.profiling]
version = "1.0"

[dependencies.rayon]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true
default-features = false

[dependencies.simba]
version = "0.10.2"
features = ["wide"]
default-features = false

[dependencies.static_assertions]
version = "1"

[dependencies.thiserror]
version = "2"
default-features = false

[dependencies.web-time]
version = "1.1"
optional = true

[dependencies.wide]
version = "1"
default-features = false

[dev-dependencies.bincode]
version = "1"

[dev-dependencies.oorandom]
version = "11"
default-features = false

[dev-dependencies.serde_json]
version = "1"

[target.'cfg(not(target_arch = "spirv"))'.dependencies.glamx]
version = "0.3"
features = ["nalgebra"]
default-features = false

[target.'cfg(not(target_arch = "spirv"))'.dependencies.nalgebra]
version = "0.35"
features = ["macros"]
default-features = false

[lints.clippy]
all = { level = "allow", priority = -1 }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(feature, values("block-solver", "debug-disable-legitimate-fe-exceptions", "debug-render", "dev-remove-slow-accessors", "simd8", "solver-bounds-checks", "unsync-callbacks"))',
    'cfg(feature, values("dim2", "f64", "std", "alloc", "bytemuck"))',
    'cfg(target_arch, values("spirv"))',
]

