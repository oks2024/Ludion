# cargo-deny: dependency licenses, RustSec advisories, duplicate-version bans and registry sources, for the root workspace and the editor's
# Tauri host (a separate cargo workspace):
#
#   cargo deny check advisories licenses bans sources
#   cargo deny --manifest-path editor/app/src-tauri/Cargo.toml --config deny.toml check advisories licenses bans sources
#
# Run by `node scripts/check.mjs --full` and ci.yml's `deny` job, never the default lane. One-time
# install per machine: `cargo install cargo-deny --locked`. `fuzz/` is outside the gate: its
# `libfuzzer-sys` carries NCSA, which the allowlist does not.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
unused-allowed-license = "allow"

[advisories]
# One config serves both workspaces: an ignore for the other workspace's crate is unused here.
unused-ignored-advisory = "allow"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained: a direct dependency of ludion-physics, pinned for the physics snapshot bytes; replacing it moves the snapshot format" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4: build-time only, via the wayland-scanner proc-macro (winit, Linux); parses the fixed Wayland protocol XML shipped in the crate, never runtime input; the fix needs quick-xml 0.41 upstream" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4: build-time only, via the wayland-scanner proc-macro (winit, Linux); parses the fixed Wayland protocol XML shipped in the crate, never runtime input; the fix needs quick-xml 0.41 upstream" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained: reached via winit, sctk-adwaita and ab_glyph, Linux client-side window decorations only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained: Tauri host only, via gtk-rs 0.18 glib-macros (the Linux webview stack); a proc-macro" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained: a compile-time proc-macro reached through ctt-astcenc in the texture cooker (ludion-cook), nothing at runtime; no upgrade exists" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* unmaintained: Tauri host only, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained: Tauri host only, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* unmaintained: Tauri host only, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained: Tauri host only, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained: Tauri host only, via urlpattern in tauri-utils" },
]

[bans]
# Duplicate versions are reported, not denied: most come from one dependency lagging another, and
# only the families below are understood and accepted. A new duplicate shows up as a warning.
multiple-versions = "warn"
# One config serves both workspaces: a skip for a version only the other workspace carries is unused.
skip = [
    { crate = "glam@0.33.8", reason = "nalgebra 0.35 and glamx via the vendored rapier carry glam 0.33 beside our 0.30 (the lock also lists 0.31 and 0.32, behind nalgebra features nothing enables)" },
    { crate = "base64@0.23.1", reason = "ureq 3 (the ComfyUI client in ludion-gen) carries base64 0.23; ours stays on gltf's 0.13 line" },
    { crate = "objc2@0.5.2", reason = "winit 0.30 carries the objc2 0.5 stack on macOS and iOS beside the 0.6 stack of the audio and window crates" },
    { crate = "ndk@0.8.0", reason = "cpal 0.15 and oboe carry ndk 0.8 beside winit's ndk 0.9 on Android" },
    { crate = "bitflags@1.3.2", reason = "winit 0.30, core-graphics and cpal's coreaudio-rs still carry bitflags 1" },
]

[sources]
# Every dependency comes from crates.io or a path (the vendored rapier and parry); a git or
# alternate-registry source is a decision, not a drift.
unknown-git = "deny"
unknown-registry = "deny"
