# Feature: SSR over reflection probes - the probe-rooms layout with screen-space reflections on and chrome props: a box-probe room
# (left) holding a chrome sphere and a chrome cube ringed by pillars under a sphere probe (right), on one polished metal floor.
# Where SSR is confident the floor shows each prop with the probe and sky fill it has in the frame (not black), and it hands off
# to the probe's reflection as the trace's confidence fades. The probes capture the sky's fill only on metal (probe-capture faces
# carry no probes), so inside the enclosed room a reflected metal still differs between the two paths: a known limit.
# `ludion render --debug-view ssr_confidence` shows the trace.
format: 1
name: "ssr-probe-metal - SSR over probes: chrome props under a box probe and a sphere probe"
