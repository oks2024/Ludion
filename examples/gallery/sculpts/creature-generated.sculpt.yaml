# creature-generated — the authored quadruped body of `creature.sculpt.yaml` wearing a *bought* head:
# the `shape: mesh` part `head` reads a mesh generated from four `render --model` views of
# `creature-head-blank.sculpt.yaml` (`Plan/comfy-generation.md` Wave 3, the multi-view round trip).
# Every other part is the authored creature's, unchanged, so the two documents are an A/B on one
# body: `creature.sculpt.yaml` carries the authored skull cluster, this one carries the generated
# shell blended onto the same neck.
