# Feature: a sequence beat — one `kind: sequence` (`sequences/demo.yaml`) drives a camera framing
# change and `restore`, two animation keys on the mannequin, a crate sliding over a `to` span, a drone
# on a path span, a voice, a dialogue line that parks the playhead and two events, while a patroller
# on its own path stays frozen for the whole hold. Bare, this scene shows the yard before the beat.
# Preview a tick of the beat over it (no game systems, no dialogue):
#   ludion render --scene examples/gallery/sequence-beat.yaml --sequence sequences/demo.yaml \
#     --bind cam=camera --bind hero=hero --bind crate=crate --bind drone=drone --at 25 --out beat.png
# The game half is `crates/ludion-testkit/tests/common/mod.rs` (`sequence_beat_builder`, `play_beat`),
# which `sequence_beat.rs` traces (`ludion docs sequences`).
format: 1
name: "sequence-beat - a keyed beat moves a camera, a crate, a drone and a hero while a patroller waits"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.2
          - 7.2
        rotation:
          - -10.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
      CameraRig:
        target:
          index: 3
          generation: 0
        rig:
          mode:
            follow:
              yaw_deg: 0.0
              pitch_deg: 14.0
              distance: 7.0
          focus_offset:
            - 0.0
            - 0.8
            - 0.0
  - name: key-light
    components:
      Transform:
        translation:
          - 1.5
          - 3.5
          - 3.0
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 5.0
        range: 24.0
  - name: hero
    components:
      Mesh:
        shape:
          character: characters/mannequin.character.yaml
        color:
          - 0.6
          - 0.45
          - 0.35
          - 1.0
        roughness: 0.8
      Animation:
        clip: idle
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.5
          - 0.0
        scale:
          - 8.0
          - 1.0
          - 8.0
      Mesh:
        shape: cube
        color:
          - 0.22
          - 0.25
          - 0.3
          - 1.0
  - name: crate
    components:
      Transform:
        translation:
          - -2.5
          - 0.5
          - 0.5
      Mesh:
        shape: cube
        color:
          - 0.8
          - 0.55
          - 0.2
          - 1.0
  - name: drone
    components:
      Transform:
        translation:
          - -2.5
          - 1.3
          - -1.5
        scale:
          - 0.4
          - 0.25
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.3
          - 0.8
          - 0.95
          - 1.0
  - name: patroller
    components:
      Transform:
        translation:
          - 2.2
          - 0.25
          - 2.2
        scale:
          - 0.5
          - 0.5
          - 0.5
      Mesh:
        shape: cube
        color:
          - 0.85
          - 0.25
          - 0.3
          - 1.0
      PathFollower:
        path: paths/sequence-patrol.path.yaml
        speed: 2.0
        mode: loop
