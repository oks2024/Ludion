# Feature: rigid-body physics (`ludion-physics`, Plan/physics.md) - a 512-body prop-pile stress
# scene at the Pain-like launcher's scale, in a static bin.
#
# The gallery's render harness ticks the built-in registry only (`check -> instantiate -> tick(0)
# -> extract -> render`), which now includes this scene's own `physics:` block - but `tick(0)`
# runs no tick, so this golden shows the authored lattice exactly as written, not a simulated
# settle. The simulated trace lives beside this file (`physics-stress.trace.txt`), produced by
# `ludion-engine`'s `physics_stress` test, which loads this scene under a bare `Engine::builder()`
# (the `physics: space: free` block below is the only opt-in there is) and steps it for real.
#
# 512 rigid props in an 8x8x8 lattice (Plan/physics.md, First consumer: "A level holds hundreds of
# props"). W0 measured 200 bodies too calm to stay live for a 600-tick trace and
# 2 000 bodies at the step-time ceiling (4.6 ms mean); 512 is a heavy launcher level that stays
# live through the trace and keeps the snapshot a manageable size.
#
# Shapes cycle by index: box, sphere, capsule (no `convex` - generated from a voxel model, never
# hand-authored; no `heightfield`). A capsule prop's Mesh is a `sphere` primitive scaled to the
# capsule's bounding ellipsoid (the only two built-in primitives are `cube` and `sphere`); the
# mesh is render-only and never touches the hash.
#
# A static bin - a box floor plus four low static box walls - keeps props hitting walls and each
# other instead of spreading into a sparse, quickly-sleeping carpet.
#
# Chaos by construction, dyadic values only (resting bodies sleep in ~48 ticks under rapier):
# every offset/rotation/velocity is derived from the prop's index by integer arithmetic over a
# power-of-two denominator, giving off-grid jitter, a distinct small initial `Velocity.angular`,
# and a column dropped from height. `physics:` block: `space: free`, everything else default.
#
# Placement is deterministic (a seeded generator, values baked in here), so this file IS the
# fixture - re-running a generator is not a gate; hand edits are legitimate (the `lights-stress.yaml`
# precedent).
