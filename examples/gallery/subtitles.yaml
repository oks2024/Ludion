# Feature: the built-in subtitle block (`SubtitleView`) over a minimal lit world. The discovered bare
# render has no dialogue running, so no panel draws; the `subtitles-driven` golden says a radio line
# and a ui line (`dialogue/subtitles.yaml`, `strings/subtitles-en.yaml`) through the test's builder.
format: 1
name: subtitles - the SubtitleView block over a lit world
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.4
          - 7.0
        rotation:
          - -12.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: ground
    components:
      Transform:
        scale:
          - 12.0
          - 1.0
          - 12.0
      Mesh:
        shape: plane
        color:
          - 0.3
          - 0.32
          - 0.36
          - 1.0
        roughness: 0.85
  - name: key-light
    components:
      Transform:
        translation:
          - 2.0
          - 4.5
          - 4.0
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 5.0
        range: 20.0
  - name: subtitles
    components:
      SubtitleView:
        font: body
