# Feature: Anti-aliasing - the SMAA 1x gallery scene. The manifest (goldens/manifest.json) pins its
# golden to `anti_aliasing: smaa`, so the committed image is the post-AA frame; every other gallery
# golden renders with AA off. Each prop is a failure mode an edge-only resolve has to repair:
# (a) a receding slatted belt, thin bright slats on a dark base that shrink toward the vanishing point;
# (b) two grazing rails, long thin boxes nearly parallel to the view direction, whose edges crawl
# across many rows at a shallow slope; (c) a thin emissive strip tilted about 10 degrees against a
# black backdrop, the worst case for stair-stepping; (d) a one-to-two-pixel wire; (e) a ten-tooth cog
# of boxes, so corners and short diagonals meet; (f) a flat matte grey wall under even light with no
# edge anywhere in a 64x48 px patch at 960x540 or 480x270, the patch the grain-preservation gate
# measures (SMAA must neither smear nor add to the per-pixel film grain); (g) an opaque UiRect holding
# a UiText, drawn after AA so its interior stays byte-identical to the unresolved frame. The sun
# comes from the camera side so nothing shades the wall; `PostProcess.grain` is Noir's 0.03, and
# dof and chromatic_aberration stay at 0.0, since either would soften the edges the pass exists to
# measure. ludion docs post-processing.
format: 1
name: "anti-aliasing - SMAA 1x: thin edges, grazing lines, a cog, grain and an opaque UI label"
