# Feature: Serious Isaac's M2 physics shape (engine request 0020) - a closed room holding 500
# `CharacterMotor`s, 120 skinned mannequins (the first 24 pinned) and 5,000 pool projectiles.
#
# The gallery's render harness ticks the built-in registry only (`check -> instantiate -> tick(0)
# -> extract -> render`), so the golden shows the authored tick-0 layout: the skins stand in their
# rest pose and the motors, which carry no mesh, are not drawn. The simulated horde lives in
# `crates/ludion-engine/tests/horde_driver.rs`, driven by `physics_horde.rs` against the committed
# trace (`physics-horde.trace.txt`) and replay (`physics-horde.lrp`): at tick 0 it switches every skin
# (the entities carrying a `character` Mesh, in file order) to its SkinBone ragdoll through
# `prefabs/mannequin-ragdoll.prefab.yaml` and pins the first 24 skins - the ones beside the long
# walls - by a ball joint to a static anchor; every 30 ticks it re-throws a quarter of the rest.
#
# Layout: a 53 x 33 m room (walls 3 m tall) with 16 static pillars; the ragdoll half is west of
# x = 0 (pinned skins 0.4 m off the long walls, then 96 on a 1.4 m grid); the motor half is east,
# 25 x 20 on a 1.2 m grid, so the +-2.4 m scripted walk along x stays clear of the ragdolls and of
# the east wall. The motors' `agents` layer ignores itself.
#
# Placement is deterministic (a throwaway generator, values baked in here), so this file IS the
# fixture - re-running a generator is not a gate (the `physics-stress.yaml` precedent).
