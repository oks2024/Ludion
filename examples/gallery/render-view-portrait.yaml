          - 0.8
          - 1.0
      RenderLayers:
        layers:
          - portrait
  - name: portrait-key
    components:
      Transform:
        translation:
          - 29.0
          - 2.2
          - 2.5
      PointLight:
        color:
          - 0.3
          - 0.5
          - 1.0
        intensity: 6.0
        range: 10.0
      RenderLayers:
        layers:
