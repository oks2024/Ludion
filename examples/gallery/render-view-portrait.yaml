  - name: portrait-figure
    components:
      Transform:
        translation:
          - 30.0
          - 0.0
          - 0.0
        scale:
          - 0.1
          - 0.1
          - 0.1
      Mesh:
        shape:
          voxel: voxels/rim-figure.voxel.yaml
        color:
          - 0.8
