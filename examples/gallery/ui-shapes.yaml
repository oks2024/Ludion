# Feature: `UiShape` (Plan/ui-hud.md W3b): analytic line, circle, ring, arc, wedge and rounded_rect with a fill
# and a stroke, drawn by `ui_shape.wgsl`. Over a dark backdrop, in canvas units:
# - Row 1: a circle as fill only, stroke only, and fill + stroke; a rounded_rect, a 20-degree rotated one with a
#   stroke, and a stroke-only one.
# - Row 2: rings at sweeps 45, 180, 270 and 360; a wedge with an inner_radius, a plain wedge, an arc.
# - Row 3: a butt and a round line (the round one overhangs its end points by half the stroke), a thin
#   line, and a 15-degree rotated `circle`-clip group cutting a ring to the inscribed circle.
format: 1
name: "ui-shapes - UiShape kinds, fill and stroke, rotation and a clipped group"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 5.0
      Camera: {}
  - name: backdrop
    components:
      UiRect:
        fill: true
        color:
          - 0.06
          - 0.07
          - 0.1
          - 1.0
        order: 0
  - name: clip-group
    components:
      UiGroup:
        anchor: top_left
        offset:
          - 1430.0
          - 690.0
        size:
          - 300.0
          - 300.0
        rotation: 15.0
        clip: circle
  - name: clip-group-frame
