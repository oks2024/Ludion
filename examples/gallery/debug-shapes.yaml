# Feature: every `DebugPen` primitive as a debug-draw line, on a 5 x 3 grid of 2.5 m cells over a dark
# floor, row-major: line, ray, path, cross, axes / aabb, sphere, capsule, circle, arc / wedge,
# ring_sector, cone, frustum_wedge, (an empty cell). The scene draws nothing itself: the lines come from
# `common::debug_shapes_builder` (testkit tests/common), a system calling the pen under the `shapes`
# category, and its golden is the driven `debug-shapes-driven.png` rendered with `debug_draw: ["shapes"]`.
# The bare discovered `debug-shapes.png` is the floor alone.
format: 1
name: "debug-shapes - debug draw: every pen primitive on a floor grid"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 9.0
          - 9.0
        rotation:
          - -45.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: sun
    components:
      Transform: {}
      DirectionalLight:
        direction:
          - 0.45
          - -0.75
          - -0.5
        color:
          - 1.0
          - 0.96
          - 0.86
        intensity: 1.1
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.1
          - 0.0
        scale:
          - 14.0
          - 0.2
          - 10.0
      Mesh:
        shape: cube
        color:
          - 0.015
          - 0.018
          - 0.022
          - 1.0
