# Feature: ScreenEffect — retro display filters as backdrop filters in UI order (Neon Shroud request 0019,
# part F). The ui-hud scene again, with two effects layered over it:
#
# - `radar-fx` (order 10): a 320x320 `crt` region hung from the top-right corner — the radar panel. It
#   filters the 3D world and every UI element under order 10 inside the rect (the timer readout, part
#   of the checker icon is outside it); pixels outside the rect are untouched.
# - `radar-label` (order 20): a clean UiText inside the region. It draws above the effect, so the
#   scanlines and curvature never touch it.
# - `screen-fx` (order 0): a fullscreen `scan` preset under every UI element, so the HUD stays crisp
#   while the world gets scanlines, a slow sweep bar, a slight posterize and noise. A render of
#   `--frames 0,1,2` shows the animated stages (noise, sweep, flicker) moving with the game tick.
# - Together the two are the cost case of the plan: a 320x320 region plus a fullscreen `scan`, the
#   `screen_fx` profile group.
format: 1
name: "screen-effects - a CRT radar region and a fullscreen scan over the HUD mock"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.4
          - 7.0
        rotation:
          - -12.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: ground
