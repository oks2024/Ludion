# Feature: fog under an orthographic camera. The same content as `fog-sprites.yaml`; every ray runs
# along the one view direction, so the haze thickens with the depth along the view and not with the
# angle off its centre. What to read in the image: the far wall is one flat tone instead of a ring that
# darkens toward the corners, and each sprite, the smoke, the embers and the label are fogged by the
# depth they sit at, like the wall beside them.
format: 1
name: "fog-sprites-ortho - transparents fogged at their own distance, orthographic"
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.05
          - 0.09
          - 0.2
        sky_horizon:
          - 0.32
          - 0.38
          - 0.5
        sky_ground:
          - 0.05
          - 0.06
          - 0.08
        ibl_intensity: 1.0
  - name: post
    components:
      PostProcess:
        bloom_threshold: 1.0
        bloom_strength: 0.08
        exposure: 1.0
        tonemap: aces
        fog_density: 0.022
        fog_color:
          - 0.3
          - 0.36
          - 0.48
        fog_start: 9.0
        fog_height: 0.0
        fog_height_falloff: 0.115
        fog_sky: 1.0
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 16.0
          - 30.0
        rotation:
          - -10.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: orthographic
          height: 26.0
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 6.0
          - 0.0
      DirectionalLight:
        direction:
          - 0.3
          - -0.8
          - -0.5
        intensity: 2.4
  - name: ground
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 0.0
        scale:
          - 160.0
          - 1.0
          - 160.0
      Mesh:
        shape: plane
        color:
          - 0.22
          - 0.26
          - 0.2
          - 1.0
  - name: far-wall
    components:
      Transform:
        translation:
          - 0.0
          - 2.5
          - -30.0
        scale:
          - 90.0
          - 5.0
          - 1.0
      Mesh:
        shape: cube
        color:
          - 0.5
          - 0.42
          - 0.36
          - 1.0
  - name: near-sprite
    components:
      Transform:
        translation:
          - -5.0
          - 2.0
          - 14.0
      Sprite:
        atlas: sprites/gallery.atlas.yaml
        frame: ship/idle
        size:
          - 2.8
          - 2.8
        billboard: true
  - name: far-sprite-sky
    components:
      Transform:
        translation:
          - 8.0
          - 12.0
          - -50.0
      Sprite:
        atlas: sprites/gallery.atlas.yaml
        frame: ship/idle
        size:
          - 7.0
          - 7.0
        billboard: true
  - name: horizon-sprite
    components:
      Transform:
        translation:
          - -10.0
          - 5.0
          - 0.0
      Sprite:
        atlas: sprites/gallery.atlas.yaml
        frame: ship/idle
        size:
          - 3.0
          - 3.0
        billboard: true
  - name: soft-sprite
    components:
      Transform:
        translation:
          - 10.0
          - 5.0
          - 0.0
      Sprite:
        atlas: sprites/gallery.atlas.yaml
        frame: ship/idle
        size:
          - 3.0
          - 3.0
        billboard: true
        color:
          - 1.0
          - 1.0
          - 1.0
          - 0.5
  - name: smoke-column
    components:
      Transform:
        translation:
          - -4.0
          - 0.2
          - -4.0
      ParticleEmitter:
        shape: sphere
        extent:
          - 0.35
          - 0.35
          - 0.35
        rate: 18.0
        life:
          - 2.0
          - 2.8
        speed:
          - 0.5
          - 1.0
        spread_deg: 14.0
        gravity: -0.9
        drag: 0.35
        start_size: 0.9
        end_size: 3.0
        start_color:
          - 0.7
          - 0.7
          - 0.72
          - 0.5
        end_color:
          - 0.5
          - 0.5
          - 0.55
          - 0.0
        softness: 0.85
        seed: 11
  - name: ember-fountain
    components:
      Transform:
        translation:
          - 3.0
          - 0.2
          - -6.0
      ParticleEmitter:
        rate: 58.0
        life:
          - 1.1
          - 1.9
        speed:
          - 3.6
          - 5.6
        spread_deg: 26.0
        gravity: 5.0
        start_size: 0.4
        end_size: 0.1
        start_color:
          - 2.0
          - 0.7
          - 0.15
          - 1.0
        end_color:
          - 1.2
          - 0.18
          - 0.03
          - 0.0
        blend: additive
        softness: 0.3
        seed: 23
  - name: label
    components:
      Transform:
        translation:
          - -3.0
          - 5.0
          - -8.0
      Text:
        text: FOG
        size: 2.0
        color:
          - 1.0
          - 0.9
          - 0.5
          - 1.0
