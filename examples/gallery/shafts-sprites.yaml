# Feature: light shafts stop at a transparent's own distance. A sprite, a particle and a world Text
# carry no depth of their own, so the march that integrates the sun's beams along each eye ray stops
# at the transparent, not at the wall or the sky behind it. What to read in the image: the near sprite stands in front of a beam
# and takes only the air in front of it, so it is not lit by the shaft behind it; the far sprite sits
# behind the colonnade and takes the beams of the air up to itself; the sprite against the sky takes
# the same beams as one over a wall; the sprite across the wall's top edge shows no seam in its beam
# term; the half-transparent sprite takes a share between the two; and the smoke and the label stop
# the beams at their own distance. The shaft term is added in the composite and is not fogged
# again, so a covered pixel carries the beams of its own march only.
