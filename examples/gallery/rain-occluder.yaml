# Feature: RainOccluder - two 3x3 m canopies side by side over open wet ground, rained on at night under one sodium spot.
# The left one is a net: it casts a shadow but carries RainOccluder { occludes: false }, so the streaks fall through it
# and the floor under it is wet. The right one carries Visibility { cast_shadows: false } and RainOccluder {}: it casts
# no moon or spot shadow, yet it stops every streak, so the floor under it is dry. Without a RainOccluder the rule is
# "what casts a shadow occludes". The camera sits at head height facing both. ludion docs weather.
# Ripples off (ripples: 0.0), so this golden shows the scene still.
format: 1
name: "rain-occluder - RainOccluder: a net lets rain through, a shadowless canopy stops it"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.7
          - 3.0
        rotation:
          - -6.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: environment
