format: 1
kind: assembly
name: humanoid
size:
  - 8
  - 16
  - 2
palette:
  B:
    color:
      - 0.25
      - 0.35
      - 0.55
      - 1.0
  H:
    color:
      - 0.85
      - 0.65
      - 0.5
      - 1.0
  L:
    color:
      - 0.3
      - 0.3
      - 0.35
      - 1.0
parts:
  - name: torso
    file: parts/ragdoll-torso.part.yaml
    place:
      - 2
      - 8
      - 0
  - name: head
    file: parts/ragdoll-head.part.yaml
    parent: torso
    place:
      - 3
      - 14
      - 0
    pivot:
      - 1.0
      - 0.0
      - 1.0
  - name: upper-arm-l
    file: parts/ragdoll-upper-arm.part.yaml
    parent: torso
    place:
      - 0
      - 10
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
  - name: upper-arm-r
    file: parts/ragdoll-upper-arm.part.yaml
    parent: torso
    place:
      - 6
      - 10
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
    mirror: x
  - name: lower-arm-l
    file: parts/ragdoll-lower-arm.part.yaml
    parent: upper-arm-l
    place:
      - 0
      - 6
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
  - name: lower-arm-r
    file: parts/ragdoll-lower-arm.part.yaml
    parent: upper-arm-r
    place:
      - 6
      - 6
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
    mirror: x
  - name: upper-leg-l
    file: parts/ragdoll-upper-leg.part.yaml
    parent: torso
    place:
      - 2
      - 4
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
  - name: upper-leg-r
    file: parts/ragdoll-upper-leg.part.yaml
    parent: torso
    place:
      - 4
      - 4
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
    mirror: x
  - name: lower-leg-l
    file: parts/ragdoll-lower-leg.part.yaml
    parent: upper-leg-l
    place:
      - 2
      - 0
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
  - name: lower-leg-r
    file: parts/ragdoll-lower-leg.part.yaml
    parent: upper-leg-r
    place:
      - 4
      - 0
      - 0
    pivot:
      - 1.0
      - 4.0
      - 1.0
    mirror: x
clips:
  carry: anims/humanoid-carry.anim.yaml
  idle: anims/humanoid-idle.anim.yaml
  lean: anims/humanoid-lean.anim.yaml
  lunge: anims/humanoid-lunge.anim.yaml
  run: anims/humanoid-run.anim.yaml
  walk: anims/humanoid-walk.anim.yaml
masks:
  head_look:
    joints:
      - torso
      - head
    weights:
      - 0.3
      - 1.0
  upper_body:
    joints:
      - torso
      - upper-leg-l
      - upper-leg-r
    descendants: true
    weights:
      - 1.0
      - 0.0
      - 0.0
blends:
  locomotion:
    sync: foot_l
    points:
      - clip: idle
        at: 0.0
      - clip: walk
        at: 2.0
      - clip: run
        at: 5.0
ik:
  hand_r:
    parts:
      - upper-arm-r
      - lower-arm-r
    effector:
      - 1.0
      - 0.0
      - 1.0
  look:
    aim: head_look
    limits_deg:
      yaw: 70.0
      pitch: 40.0
