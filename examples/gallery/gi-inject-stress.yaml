# gi-inject-stress - GI wave 3' (`Plan/gi-wave3-dynamic-injection.md`, the injection stress
# scene section): the injection compute pass under the cap.
#
# 300 GiDynamic-marked point lights - the MAX_PROJECTILES cap (`games/vigil/src/tunables.rs`) as
# a static layout, `lights-stress.yaml`'s "authoring question, not an engine constant" posture
# applied to the dynamic-injection term instead of the clustered light path. Two populations,
# deliberately unlike each other (D13's own split):
#
#   250 BOLT spread lights  - scattered across the whole floor at chest height (0.8-2.2), warm
#                             tracer colors, range 2.3-3.4 - the regime D13 measured as real: not
#                             clustered, single digits simultaneous in actual play, this scene's
#                             worth of *positions* standing in for many separate frames' worth of
#                             a handful of bolts each.
#   50  BURST clustered lights - packed into a ~2x2x1.4 pocket at (x=-12.0, z=4.0), the
#                             adversarial regime the plan names as the reason the bin has a
#                             ceiling at all: several dozen lights landing in the same handful of
#                             `gi_bin.rs` cells. Deliberately moderate per-light intensity
#                             (~0.32-0.50, a cooler palette) so the summed indirect term reads as
#                             a bright-but-bounded pool rather than a clipped white blob - the
#                             "bounded, not blooming" legibility the plan asks the golden to show,
#                             and what `ludion image-stats`' clipped_high ceiling checks
#                             mechanically.
#
# Floor-and-walls only (no roof): a 46x46 arena bounded by four 6-unit walls, sized to give the
# `GiVolume` a real 3D lattice (cell_size 0.5, probe_spacing 1.0) without a district-scale probe
# count - this is a compute-pass stress test, not a bake-cost one (SS6's district bake budget is
# W4's, not this scene's). Deliberately no `Environment`, `PostProcess` or `DirectionalLight` -
# the `lights-stress.yaml` precedent: every absent feature is one fewer cost mixed into the
# `gi_inject`/`scene` passes the budget file gates.
format: 1
