# Feature: DirectionalLight.cascades - a fitted sun shadow along a 100 m colonnade. A low raking sun from the side and
# slightly ahead throws a stripe from every pillar across the aisle, from the mannequin at the camera's feet to the far
# end of the aisle: four cascades fit to the camera, each one a finer shadow map nearer the lens, so the near stripes
# stay crisp and the far ones still resolve. No environment, no point lights: the sun is the look. The same scene under
# the sun_cascades debug view tints each surface by the cascade that shadows it.
format: 1
name: "sun-cascades - DirectionalLight.cascades: a raking sun fitted to the camera down a 100 m colonnade"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.7
          - 0.0
        rotation:
          - -3.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 0.0
      DirectionalLight:
        direction:
          - 0.75
          - -0.35
          - -0.55
        color:
          - 1.0
          - 0.94
          - 0.82
        intensity: 2.6
        shadow_near: -60.0
        shadow_far: 60.0
        cascades: 4
