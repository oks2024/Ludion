# Feature: OccludedSilhouette patterns - a screen-space line pattern on the fill, an inner outline, and the game's slice look.
# Left to right, each figure half behind cover: (1) `pattern: scanlines` at 55% white (the default fill alpha); (2) `pattern: hatch`
# (45-degree lines); (3) a solid fill with an `inner_outline` band hugging the edge of the hidden region and the usual outer
# `outline`; (4) the slice figure: a voxel figure lying prone under a low box "truck", default white, scanlines plus an inner
# outline. `PostProcess` is the game's slice look (vignette 0.25, vignette_radius 0.6, grain 0.04, grain_size 0.0015), so the
# pattern is judged under the film pass. `period` and `px` are in 1080p pixels; the pattern is anchored to the screen.
# ludion docs occluded-silhouette.
format: 1
name: occluded-silhouette-styles - pattern fills and an inner outline on an OccludedSilhouette
