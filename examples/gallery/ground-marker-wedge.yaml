# Feature: GroundMarker wedge — a wireframe vision-cone telegraph (a circular sector). The apex sits at
# the entity origin and the cone faces local +X; an outline, an inner range arc and a polar grid draw
# over a mostly transparent interior, and `fill` grows the stronger interior (and a leading arc) out
# from the apex as suspicion rises. The colour is the whole look: green phosphor for "watching", red
# once alerted. The row shows fill 0, 0.35 and 0.7 in green and fill 1 in red; the wedge behind it is
# yawed 40 degrees to cover a non-axis orientation. Seen from a ~55 degree top-down gameplay camera.
format: 1
name: "ground-marker-wedge - GroundMarker wedge: wireframe vision cone, inner arc, grid, fill from the apex"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 3.5
          - 19.7
          - 11.7
        rotation:
          - -55.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: key-light
    components:
      Transform:
        translation:
          - 0.0
          - 10.0
          - 4.0
      PointLight:
        color:
          - 0.8
          - 0.85
          - 1.0
        intensity: 2.0
        range: 40.0
  - name: ground
    components:
      Transform:
        scale:
          - 50.0
          - 1.0
          - 50.0
      Mesh:
        shape: plane
        color:
          - 0.05
          - 0.06
          - 0.08
          - 1.0
  - name: cone-fill-0
    components:
      Transform:
        translation:
          - -12.0
          - 0.0
          - 0.0
      GroundMarker:
        shape:
          type: wedge
          half_angle_deg: 30.0
          outer_radius: 7.0
          inner_radius: 3.0
          fill: 0.0
          grid_spacing: 1.0
        color:
          - 0.25
          - 1.6
          - 0.6
          - 0.9
  - name: cone-fill-35
    components:
      Transform:
        translation:
          - -4.0
          - 0.0
          - 0.0
      GroundMarker:
        shape:
          type: wedge
          half_angle_deg: 30.0
          outer_radius: 7.0
          inner_radius: 3.0
          fill: 0.35
          grid_spacing: 1.0
        color:
          - 0.25
          - 1.6
          - 0.6
          - 0.9
  - name: cone-fill-70
    components:
      Transform:
        translation:
          - 4.0
          - 0.0
          - 0.0
      GroundMarker:
        shape:
          type: wedge
          half_angle_deg: 30.0
          outer_radius: 7.0
          inner_radius: 3.0
          fill: 0.7
          grid_spacing: 1.0
        color:
          - 0.25
          - 1.6
          - 0.6
          - 0.9
  - name: cone-alert
    components:
      Transform:
        translation:
          - 12.0
          - 0.0
          - 0.0
      GroundMarker:
        shape:
          type: wedge
          half_angle_deg: 30.0
          outer_radius: 7.0
          inner_radius: 3.0
          fill: 1.0
          grid_spacing: 1.0
        color:
          - 2.0
          - 0.15
          - 0.1
          - 0.9
  - name: cone-yawed
    components:
      Transform:
        translation:
          - -2.0
          - 0.0
          - -8.0
        rotation:
          - 0.0
          - 40.0
          - 0.0
      GroundMarker:
        shape:
          type: wedge
          half_angle_deg: 30.0
          outer_radius: 7.0
          inner_radius: 3.0
          fill: 0.5
          grid_spacing: 1.0
        color:
          - 0.25
          - 1.6
          - 0.6
          - 0.9
