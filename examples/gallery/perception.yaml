# Feature: perception (`Perceiver`, `SightTarget`, `NoiseZone`; Plan/perception.md, Neon Shroud request 0001) -
# a stealth corridor. Three guards watch a corridor along +X: guard-a faces down it with an inner and an outer
# sight zone, guard-b stands against the north wall looking across it (hearing, memory), and a camera on the
# end wall pans over it (period_ticks 2, so carried samples are hashed state). A cover_low crate, a cover_high
# wall and a raised cover_overhead slab break the lines of sight; a NoiseZone muffles the second half.
#
# The gallery renders tick 0: a static corridor. The intruder walks, crouches and goes prone only under the
# test builder of `ludion-engine`'s `perception_gallery` test, which installs `PerceptionConfig`, the route and the
# footsteps, and traces the per-tick `WorldHash` against `perception.trace.txt`. Under a plain `Engine::builder()`
# every component here is builtin and inert.
