          - 2.0
          - 0.0
        scale:
          - 0.4
          - 4.0
          - 5.0
      Mesh:
        shape: cube
        color:
          - 0.6
          - 0.55
          - 0.5
          - 1.0
  - name: sodium-spot
    components:
      Transform:
        translation:
          - 6.0
          - 4.5
          - 2.5
      SpotLight:
        color:
          - 1.0
          - 0.62
          - 0.22
        intensity: 9.0
        range: 22.0
        direction:
          - -8.0
          - -4.5
          - -1.0
        inner_angle: 30.0
        outer_angle: 50.0
        cast_shadows: true
  - name: smoke
    components:
      Transform:
        translation:
          - -2.6
          - 0.2
          - 2.5
      ParticleEmitter:
        shape: sphere
        extent:
          - 0.4
          - 0.2
          - 2.2
        rate: 90.0
        life:
          - 2.0
          - 3.0
        speed:
          - 0.2
          - 0.6
        spread_deg: 20.0
        gravity: -0.8
        drag: 0.3
        start_size: 0.7
        end_size: 1.6
        start_color:
          - 0.9
          - 0.9
          - 0.9
          - 0.55
        end_color:
          - 0.9
          - 0.9
          - 0.9
          - 0.0
        softness: 0.85
        lit: true
        shadowed: true
        seed: 5
  - name: sparks
    components:
      Transform:
        translation:
          - 2.8
          - 0.2
          - 3.5
      ParticleEmitter:
