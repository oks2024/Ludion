# Feature: ParticleEmitter.shadowed and ParticleEmitter.stretch - lit particles that take the shadow maps, and sparks drawn
# as velocity capsules. A dark room with one shadow-granted sodium spot from the right throws a casting wall's shadow across
# the floor. A lit `shadowed: true` smoke plume rises astride the wall's end, so the half behind the wall goes dark where the
# spot's tap is blocked and the half past it stays lit. An additive spark burst with `stretch: 1.5` and gravity falls in the
# lit pool, each spark a capsule along its own velocity. Rendered at tick 12, a fixed frame of the burst.
format: 1
name: "particles-shadowed - shadowed lit smoke across a wall's shadow edge, and stretched sparks"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 4.6
          - 11.0
        rotation:
          - -20.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: dark
    components:
      Environment:
        sky_zenith:
          - 0.0
          - 0.0
          - 0.0
        sky_horizon:
          - 0.0
          - 0.0
          - 0.0
        sky_ground:
          - 0.0
          - 0.0
          - 0.0
        ambient:
          - 0.01
          - 0.01
          - 0.012
  - name: floor
    components:
      Transform:
        scale:
          - 20.0
          - 1.0
          - 14.0
      Mesh:
        shape: plane
        color:
          - 0.42
          - 0.42
          - 0.45
          - 1.0
  - name: back-wall
    components:
      Transform:
        translation:
          - 0.0
          - 3.0
          - -5.0
        scale:
          - 20.0
          - 6.0
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.42
          - 0.42
          - 0.45
          - 1.0
  - name: casting-wall
