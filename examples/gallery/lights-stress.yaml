# lights-stress - the clustered-forward stress scene: 500 point lights over lit geometry.
#
# Built to the PRODUCTION workload class rather than to a number that looks impressive
# (`Plan/clustered-forward.md` wave 2, the spatial arc's e6 lesson: grow the bench to the real
# shape before claiming the win). Two populations, both sized off vigil:
#
#   200 TORCH statics  - ranges 8-15, warm, at head height beside the buildings. This is what a
#                        torch-lit district authors: overlapping pools that light the ground and
#                        two building faces each.
#   300 PROJECTILE movers - ranges 1.5-3.0, small and bright, at chest height across the plaza.
#                        A horde frame's tracer light: individually tiny, collectively the
#                        population the 16-light cap could never express and the nearest-16
#                        selection would have popped through.
#
# 500 lights is 31x the deleted cap, and the point is that the number is now an authoring
# question rather than an engine constant.
#
# Placement is deterministic (a seeded generator, values baked in here), so this file IS the
# fixture - re-running any generator is not part of any gate, and editing a number by hand is a
# legitimate edit.
#
# Deliberately carries NO `Environment`, `PostProcess` or `DirectionalLight`: the budget
# calibrated on it (`budgets/pinned-rtx3090-lights-stress.toml`) exists to gate the *clustered
# light path*, and every absent feature is one fewer cost mixed into the `scene` pass. It renders
# through the engine's shipped defaults, exactly as `examples/gallery/lights.yaml` does.
