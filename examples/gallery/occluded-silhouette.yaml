          - 0.6
          - 1.0
      OccludedSilhouette:
        color:
          - 0.2
          - 1.0
          - 0.3
          - 0.6
        outline:
          px: 2.0
          alpha: 1.0
        when: always
  - name: control
    components:
      Transform:
        translation:
          - 7.4
          - 0.0
          - -0.5
        scale:
          - 0.25
          - 0.25
          - 0.25
      Mesh:
        shape:
          assembly: voxels/figure.assembly.yaml
        color:
