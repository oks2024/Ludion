# Feature: Rain roof occlusion - a guard hut at night under one sodium spot, rained on from above. The streaks fall
# in the open and stop at the roof: none under the 1.5 m awning, none through the doorway, a crisp edge where the
# awning ends, and the coat puddle in front of the hut catches the open rain. The roof and awning cast shadows, which
# is what occludes the rain (Rain.occlusion). A presentation entity holds the rain, so it never enters the world
# hash. The camera sits at head height facing the hut. ludion docs weather.
# Ripples and splashes off (ripples: 0.0, splashes: 0.0), so this golden shows the scene still.
# Shadows and backlight off (shadowed: false, backlight: 0.0).
format: 1
name: "rain-awning - Rain: no streaks under the awning or in the doorway"
entities:
