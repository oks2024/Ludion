    components:
      Transform:
        translation:
          - 0.0
          - 3.2
          - 4.5
        rotation:
          - -31.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 55.0
      CameraRig:
        target:
          index: 3
          generation: 0
        rig:
          mode:
            track:
