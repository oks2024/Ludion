# Feature: CameraRig — a scene camera that rides a rail (a `kind: path` track) after a target. The
# hero cube follows `paths/camera-route.path.yaml`; the camera, on `paths/camera-track.path.yaml`,
# keeps its offset behind and above the hero, projected onto the rail. Bare, this scene shows
# the authored pose, set near where the rig snaps on its first tick; the game half is
# `crates/ludion-testkit/tests/common/mod.rs`, which at tick 60 swaps to a side-on rig (a timed
# blend), cuts back with `snap_rig` at 180 and pulses trauma at 220 (`ludion docs camera`).
# Run `--debug-draw camera` to see the rail, the search window, the eyes, the focus and the anchor.
format: 1
name: "camera-rig - a rail camera follows a hero cube, with blends, a snap and a shake"
seed: 1
entities:
