# A standalone atlas of the ramp-mode hull and its colour-mode twin, both including `ramps.palette.yaml`.
# `ludion generate-atlas` writes the committed `ramps.png` + `ramps.atlas.yaml` beside it — never edit
# those by hand. The `sprite-ramps` gallery scene shows the pair side by side.
format: 1
kind: atlas-source
name: ramps
pixels_per_unit: 16.0
filter: nearest
inputs:
  - hull-ramp.sprite.yaml
  - hull-color.sprite.yaml
