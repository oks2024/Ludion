# A standalone atlas whose one input is a sprite that references a shared `kind: palette` document
# (`emblem.sprite.yaml` -> `emblem.palette.yaml`). `ludion generate-atlas` resolves the include, bakes,
# and writes the committed `emblem.png` + `emblem.atlas.yaml` beside it — never edit those by hand. The
# `atlas-drift` gate re-bakes this on both pinned platforms and byte-compares, so the shared-palette
# resolution is proven deterministic.
format: 1
kind: atlas-source
name: emblem
pixels_per_unit: 16.0
filter: nearest
inputs:
  - emblem.sprite.yaml
