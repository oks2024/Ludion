# A standalone atlas of the gallery ship and its self-lit twin (`op: light` from the cockpit and thrusters).
# `ludion generate-atlas` writes the committed `self-light.png` + `self-light.atlas.yaml` beside it — never
# edit those by hand. The `sprite-self-light` gallery scene shows the pair side by side.
format: 1
kind: atlas-source
name: self-light
pixels_per_unit: 16.0
filter: nearest
inputs:
  - ship.sprite.yaml
  - ship-lit.sprite.yaml
