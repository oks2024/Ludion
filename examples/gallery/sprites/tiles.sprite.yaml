# The gallery's cave tileset — five 8x8 frames the tilemap scene lays out on one atlas: `floor`,
# `wall`, `wall-top`, `crate`, `hazard`. Every frame is edge-to-edge opaque so the grid has no gaps,
# and the grain, the bevel and the crate's shading all come from `effects:` on flat glyph fields.
