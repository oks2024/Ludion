# The gallery's two shmup bolts: `player` a long cyan capsule, `enemy` a short magenta pip.
# Each frame keeps a one-texel transparent margin so the doc-level `blur` has room to bloom into —
# the glow is that blur over an emissive core, never a halo painted glyph by glyph.
format: 1
kind: sprite
name: bullet
size:
  - 4
  - 8
seed: 91
palette:
  o:
    color: "#21adff"
    emissive: 1.2
  "*":
    color: "#ffffff"
    emissive: 3.0
  y:
    color: "#ff2176"
    emissive: 1.2
  x:
    color: "#fff9fd"
    emissive: 3.0
frames:
  player:
    mirror: xy
    rows:
      - ".."
      - ".o"
      - ".*"
      - ".*"
  enemy:
    mirror: xy
    rows:
      - ".."
      - ".."
      - ".y"
      - ".x"
effects:
  - op: blur
    radius: 1
  - op: noise
    frames:
      - enemy
    amount: 0.03
