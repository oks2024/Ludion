# The gallery's cave-shmup player ship: a swept-delta hull with a lit cockpit and two thrusters.
# Three frames of one silhouette — `idle`, and the two banks leaned one texel column and narrowed.
# The plating gradient, the bevel and the dark rim are `effects:`, never painted into the glyphs.
format: 1
kind: sprite
name: ship
size:
  - 16
  - 12
seed: 4211
palette:
  from: ship.palette.yaml
frames:
  idle:
    mirror: x
    rows:
      - "........"
      - ".......#"
      - "......##"
      - "......#o"
      - ".....##o"
      - "....=###"
      - "...==###"
      - "..===###"
      - ".====###"
      - ".====#*#"
      - ".===..*."
      - "........"
