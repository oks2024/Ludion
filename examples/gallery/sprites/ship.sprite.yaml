      - "......##........"
      - ".....####......."
      - ".....#oo#......."
      - "....##oo##......"
      - "....######......"
      - "...=######=....."
      - "..==######==...."
      - ".===######===..."
      - ".===#*##*#===..."
      - ".==..*..*..==..."
      - "................"
  bank-right:
    rows:
      - "................"
      - "........##......"
      - ".......####....."
      - ".......#oo#....."
      - "......##oo##...."
      - "......######...."
