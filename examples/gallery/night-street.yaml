# night-street - a built-in-registry stand-in for a vigil night district, so `render --sweep` and
# `image-stats` (which only reach the built-in registry, never a district's own components) can tune
# the volumetric medium against vigil-shaped geometry: a street canyon of tall buildings, a colonnade
# the moon casts through, and a character that throws a long shadow.
#
# It is authored at the look the medium's exit sitting was chasing - visible raking shafts, not a
# flat veil - and the four ingredients that get there are the durable finding (see the shipped
# artifact and `Plan/volumetric-medium.md`):
#   1. CAMERA that sees the air. The shafts live in the air above the street; a steep follow-cam
#      staring at the ground crops them out. This scene pitches only -12 deg. (Swept -12..-58: the
#      beams vanish as the pitch approaches vigil's follow angle - the real reason a district reads
#      as veil, and a camera/game-side call, not a medium knob.)
#   2. BACKLIT azimuth. The eye looks toward the moon (direction mostly +z, down-street) so each ray
#      travels along a beam. vigil's own moon (0.32,-0.45,0.83) already has this; fog_anisotropy
#      stays 0 because the forward lobe still points away from a downward view.
#   3. OCCLUDERS in the air column - the colonnade and building gaps give the moon something to cast
#      through, so there is shadowed air to rake the beams against.
#   4. A DARK backdrop - fog_sky 0.4 with a dark fog_color, so the shadowed air is near-black and the
#      beams stand out instead of drowning in sky-lit haze.
#
# Grade/exposure/vignette/film fields are vigil's env-night values verbatim, so the night look
# matches; the moon DIRECTION, intensity, and shadow ANCHOR are this scene's own geometry (a
# DirectionalLight's Transform.translation is the frustum centre, not a sky position).
format: 1
name: night-street - a vigil-geometry testbed for the volumetric medium
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.01
          - 0.02
          - 0.055
        sky_horizon:
          - 0.05
          - 0.08
          - 0.14
        sky_ground:
          - 0.006
          - 0.008
          - 0.015
        sun_disc_size: 3.0
        sun_disc_intensity: 6.0
        ibl_intensity: 1.2
      PostProcess:
        bloom_threshold: 0.5
        bloom_strength: 0.125
        exposure: 0.6
        tonemap: aces
        dither: true
        contrast: 0.98
        saturation: 1.22
