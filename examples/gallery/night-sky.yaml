# Feature: Environment/IBL night sky - the material-park roughness x metallic sweep under a
# procedural moonlit-gradient Environment. The sky is an authored gradient (zenith / horizon /
# ground, no image asset); its GPU-prefiltered irradiance + specular light the meshes, so the
# metals (bottom rows) reflect the sky instead of going black under flat ambient. A moon
# DirectionalLight places the disc + a cool key with its shadow; warm point lights lift the
# foreground; the emissive voxel beacon blooms - `bloom_strength` sits just above the shipped 0.1,
# the same relationship it held (0.7) against the 0.6 the engine's former single-blur chain shipped.
# Environment/IBL Wave 2 new-bless gate.
format: 1
name: "night-sky - Environment/IBL: moonlit gradient + roughness x metallic sweep + emissive beacon"
