# Feature: projectile gibs — 1,000 debris shots (asset-mesh and cube looks, tumbling, scaled per
# axis, casting shadows, shrinking over their last seconds) thrown into a walled room settle on the
# floor. This file is the empty room; the driven golden `projectile-gibs-settle` throws them
# (`crates/ludion-testkit/tests/gallery.rs`).
