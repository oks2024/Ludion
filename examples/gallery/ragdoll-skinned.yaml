# Feature: SkinBone parts drive a skinned mesh's bones. The W1 mannequin
# (`meshes/skin-mannequin.mesh.yaml`, 11 joints) is one skin entity plus 11 invisible rigid parts,
# each linked to a joint by `SkinBone { skin, bone }`, joined by 10 `Joint`s. No part authors a
# `Transform`: the spawn pose comes from the skin's `Transform` × the bone's rest pose
# (`Plan/skeletal-animation.md` decision 5). The rig tumbles down a small staircase, exercising the
# posed bone palette (`extract.rs::posed_palette`) under real physics. Anchors are the joint tree's
# head-in-parent (`ludion check-scene <mesh> --bounds`); the elbow hinge axes are computed from the
# mesh document's joint rest rotations, since the arms sit at 45° in the A-pose (decision 8).
format: 1
name: ragdoll-skinned - SkinBone parts drive a skinned mannequin over a staircase
physics:
  space: free
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.5
          - 1.6
          - 3.5
        rotation:
