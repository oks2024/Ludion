# Feature: Decal — a projected box that paints textures onto the surfaces inside it. Back row, left to
# right: (a) a two-level step under one unrotated hazard stripe: it paints both treads and fades out on
# the riser (the default angle_fade [60, 80]); (b) the same stripe rotated onto a wall; (c) a flat swatch
# half in a block's sun shadow, the shadowed half dark (an alpha decal is lit like its receiver);
# (d) a coat puddle at roughness 0.05 beside an emissive cube, and a mirror-smooth metallic swatch,
# inside a ReflectionProbe, so the SSR, probe and sky reflections show; (e) a multiply scorch at layer -1
# over alpha paint at layer 0, the scorch darkening the paint (lit decals draw first, then multiply and
# add, whatever the layer). Front row: (f) a thin HDR add line that blooms; (g) two overlapping swatches
# on one layer, the earlier entity on top; (h) the skinned mannequin in a paint box, the floor painted
# and the mannequin clean; (k) a GroundMarker disc reading on top of a ring decal; (i) a decal with
# receivers: hierarchy, painting its crate and not the wall behind; (j) a DropShadow blob darkening
# paint. Swatches omit roughness (the floor's 0.8 is inherited) and every other field is a default,
# pinned here by omission. ludion docs decals.
format: 1
name: "decals - Decal: alpha, multiply, add, coat; angle fade, receivers, order"
