# Feature: Viewmodel post exclusion — screen-space ambient occlusion never sees the gun, so no dark
# rim rings it where it crosses a wall corner, and the gun itself takes no occlusion
# (`ludion docs post-processing`).
format: 1
name: "viewmodel-ssao - a first-person gun in front of a wall corner has no AO halo"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.6
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 70.0
      CameraRig:
        target:
          index: 1
          generation: 0
        rig:
          mode:
            first_person: {}
      ViewmodelLens: {}
      PostProcess:
        ssao: 1.0
        ssao_radius: 0.5
  - name: hero
    components:
      Transform: {}
  - name: sun
    components:
      Transform: {}
      DirectionalLight:
        direction:
          - 0.4
          - -0.7
          - -0.5
        color:
          - 1.0
          - 0.96
          - 0.88
        intensity: 2.4
  - name: lamp
    components:
      Transform:
        translation:
          - 0.6
          - 2.4
          - 0.8
      PointLight:
        color:
          - 1.0
          - 0.85
          - 0.6
        intensity: 2.0
        range: 8.0
  - name: ground
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - -10.0
        scale:
          - 40.0
          - 1.0
          - 40.0
      Mesh:
        shape: plane
        color:
          - 0.42
          - 0.46
          - 0.4
          - 1.0
        roughness: 0.9
  - name: wall
    components:
      Transform:
        translation:
          - 0.0
          - 1.6
          - -2.0
        scale:
          - 6.0
          - 3.0
          - 1.0
      Mesh:
        shape: cube
        color:
          - 0.78
          - 0.3
          - 0.26
          - 1.0
        roughness: 0.7
  - name: side wall
    components:
      Transform:
        translation:
          - 1.4
          - 1.6
          - -2.0
        scale:
          - 1.0
          - 3.0
          - 4.0
      Mesh:
        shape: cube
        color:
          - 0.7
          - 0.68
          - 0.6
          - 1.0
        roughness: 0.7
  - name: gun
    presentation: true
    components:
      Parent:
        index: 0
        generation: 0
      Transform:
        translation:
          - 0.22
          - -0.18
          - -0.45
        scale:
          - 0.08
          - 0.08
          - 0.45
      Mesh:
        shape: cube
        color:
          - 0.1
          - 0.9
          - 0.35
          - 1.0
        roughness: 0.4
      Viewmodel: {}
