# The parts of the mannequin's ragdoll: 11 rigid `SkinBone` bodies and their `Joint`s, none with a
# `Transform`. The last part, `$skin`, stands for the live skinned entity and is never spawned;
# `switch_skin_to_ragdoll` binds the parts to it; asset paths here resolve from this file's directory.
# See `ludion docs physics-joints`.
format: 1
kind: prefab
name: mannequin-ragdoll
entities:
