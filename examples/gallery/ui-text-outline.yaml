# Feature: `outline` on UiText and UiList (Plan/ui-hud.md W5a): ink drawn under the glyph fill in the
# one UI text draw, over saturated and white bands that stand in for a bright bloom scene.
# - White band: Inter (SDF) at two widths; the outline comes from the distance field.
# - Yellow band: Silkscreen (bitmap) at k=1 and k=2 whole source pixels.
# - Magenta band: the embedded 8x8 face at k=1 and k=2, and an outlined UiList on the right.
# - Cyan band: outlined text inside a scaled (0.8), half-opaque `UiGroup` with a `rect` clip cutting it.
# No width here is clamped, so the scene is warning-free.
format: 1
name: "ui-text-outline - UiText and UiList outlines on SDF, bitmap and embedded faces"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 5.0
      Camera: {}
  - name: band-white
    components:
