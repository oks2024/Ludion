# Feature: Collider — the authored collision layout, made visible (Phase 12, decision 8).
#
# Collider is render-inert (nothing draws it, and gallery scenes run no systems), so this golden
# can show neither collision response nor the collider itself. Instead, each lit Mesh primitive's
# visible x/z size exactly mirrors its entity's Collider: a sphere's scale equals its circle
# `diameter` (the unit sphere mesh has diameter 1); a cube's x/z scale equals 2x its aabb
# `half_extents` (height is free — colliders have no vertical extent). The golden therefore shows
# the authored collision shapes and placement, and the scene doubles as the render-inertness
# proof: stripped of every Collider block it renders byte-identically (asserted in
# ludion-testkit's gallery tests). The feature's BEHAVIOR is proven by the ludion-spatial
# conformance suite, not by this image.
format: 1
name: "colliders - Collider: circle and aabb collision shapes, mirrored by visible meshes"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 5.0
          - 11.0
        rotation:
          - -25.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: ground
    components:
      Transform:
        scale:
          - 16.0
          - 1.0
          - 16.0
      Mesh:
        shape: plane
        color:
          - 0.5
          - 0.55
          - 0.6
          - 1.0
