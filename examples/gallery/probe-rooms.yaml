# Feature: Reflection probes - an open-front room (left) fitted with a box probe and a polished metal sphere ringed by
# coloured pillars (right) with a sphere probe, on one glossy floor under a dim night sky. Inside each volume the floor
# and the metal reflect the captured surroundings, with parallax; the gap between them reflects the plain sky.
# `ludion render --debug-view probe_index` shows which probe owns each pixel.
format: 1
name: "probe-rooms - ReflectionProbe: a box room and a sphere ring against the sky fallback"
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.015
          - 0.028
          - 0.075
        sky_horizon:
          - 0.07
          - 0.1
          - 0.17
        sky_ground:
