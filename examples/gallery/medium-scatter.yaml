# Feature: PointLight/SpotLight scatter - local lights in-scatter into the fog medium. A closed room with no sun: a
# cluster of four warm candles on an altar glows in the air, a pillar between the camera and the altar leaves a dark
# wedge of air in its shadow (the brightest candle casts shadows, so the gap is the shadowed scatter), and a magenta
# shadowed spot telegraph throws a visible cone down onto the floor. No Environment: the lights are the look.
# Every value came off a `render --sweep` contact sheet at 1920x1080.
# `fog_density` 0.06: swept 0.03/0.06/0.09/0.14 - 0.03 leaves the glow a faint halo and the spot cone barely there, 0.14
# fogs the far wall into the dark and the pillar's gap starts to fill; 0.06 keeps the room legible with the cone and
# the glow both clear. `fog_color` is near black-warm, never black, so the unlit air is not a void.
# `fog_anisotropy` 0.5 is milder than the 0.7 default: the camera sees the candles side-on, so a strong forward lobe
# would dim the glow.
# `scatter` 1.0 on every light: swept 0/0.5/1/2 on the brightest candle - the glow around the altar grows with it and
# the pillar's shadowed wedge stays dark at every value; 2 starts to blow the altar out.
# Candle intensities 2.0-3.0 and the dark walls (0.12): at 5.0 on pale walls the room washes to flat beige and the
# glow loses its edge.
format: 1
name: "medium-scatter - local lights scatter into the fog: a candle altar behind a pillar, and a spot telegraph"
