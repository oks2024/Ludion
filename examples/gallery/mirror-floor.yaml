# Feature: Screen-space reflections - a three-strip floor under a moonlit sky: polished metal (roughness 0.02), a
# smooth dielectric (0.15) and a rougher one (0.55, inside the SSR fade band), with lit cubes and spheres and one
# emissive cube standing on it. `PostProcess.ssr: 1.0` turns the trace on; the objects mirror in the two smooth strips
# and the reflection fades to the sky in the third. Use `ludion render --debug-view ssr_confidence` to see the trace.
format: 1
name: "mirror-floor - SSR: metal, smooth and rough strips reflecting lit objects"
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.015
          - 0.028
          - 0.075
        sky_horizon:
          - 0.07
          - 0.1
          - 0.17
        sky_ground:
          - 0.008
          - 0.01
          - 0.018
        sun_disc_size: 5.0
        sun_disc_intensity: 8.0
        ibl_intensity: 1.2
      PostProcess:
        ssr: 1.0
  - name: moon
    components:
      Transform:
        translation:
          - -7.0
          - 12.0
          - 9.0
      DirectionalLight:
        direction:
          - 0.36
          - -0.5
          - -0.8
        color:
          - 0.7
          - 0.78
          - 1.0
        intensity: 1.6
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 5.0
          - 11.0
        rotation:
          - -25.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: strip-metal
