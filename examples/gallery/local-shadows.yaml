# Feature: PointLight/SpotLight cast_shadows - local-light shadows in a dark room. A shadowed spot from above-left throws a
# crate and the mannequin onto the floor; a shadowed point light on the right ringed by pillars throws radial shadows
# across the floor and onto the side and back walls (the cube's six faces); a blue unshadowed point light behind a
# short wall shows the contrast, its light passing straight through. No sun, no environment: the lights are the look.
