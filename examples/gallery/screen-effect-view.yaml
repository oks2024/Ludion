# Feature: a `ScreenEffect` on a secondary view - the radar window of `render-view-radar` seen through a CRT filter.
# `target: { view: radar }` runs the effect as the last step of the radar view's own frame, so the scanlines and the
# barrel curvature are baked into the texture the window shows; the room in perspective and the frame around the
# window are unfiltered.
# ludion docs screen-effects.
format: 1
name: "screen-effect-view - ScreenEffect: a CRT filter on a RenderView"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 9.0
          - 16.0
        rotation:
          - -32.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: radar-cam
    components:
      Transform:
        translation:
          - 0.0
          - 15.0
          - 0.0
        rotation:
          - -90.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: orthographic
          height: 13.0
      RenderView:
        name: radar
        size:
          - 256
          - 256
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 6.0
          - 0.0
      DirectionalLight:
        direction:
          - -0.4
          - -0.8
          - -0.4
        color:
          - 1.0
          - 0.95
          - 0.9
        intensity: 1.4
  - name: lamp
    components:
      Transform:
        translation:
          - 0.0
          - 3.0
          - 0.0
      PointLight:
        color:
          - 1.0
          - 0.8
          - 0.55
        intensity: 3.0
        range: 12.0
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.1
          - 0.0
        scale:
          - 12.4
          - 0.2
          - 12.4
      Mesh:
        shape: cube
        color:
          - 0.2
          - 0.22
          - 0.26
          - 1.0
        roughness: 0.9
  - name: wall-back
    components:
