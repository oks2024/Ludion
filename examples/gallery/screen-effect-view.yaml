        translation:
          - 0.0
          - 0.7
          - -6.0
        scale:
          - 12.4
          - 1.4
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-front
    components:
      Transform:
        translation:
          - 0.0
          - 0.7
          - 6.0
        scale:
          - 12.4
          - 1.4
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-left
    components:
      Transform:
        translation:
          - -6.0
          - 0.7
          - 0.0
        scale:
          - 0.4
          - 1.4
          - 12.0
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-right
    components:
      Transform:
        translation:
          - 6.0
