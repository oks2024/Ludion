# Feature: fog at a transparent's own distance. A sprite, a particle and a world Text carry no depth,
# so the composite fogs each pixel they cover at the distance of the transparent itself, not of the
# wall or the sky behind it. What to read in the image: the near sprite stays clear and the far one
# sits in haze (against the sky it is fogged too, though the sky never is); the sprite across the
# wall's top edge takes one fog on both sides, with no seam; the half-transparent sprite keeps its
# colour over both the ground and the wall; the smoke is hazed with the distance it is at; and the
# additive embers over the fogged wall are dimmed by their own distance. Their fog is the known
# approximation: the wall under a bright ember takes the ember's fog as well, so a bright ember can read as
# a small fog hole with a tint shifted toward the unfogged wall.
format: 1
name: fog-sprites - transparents fogged at their own distance
