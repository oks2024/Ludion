# Feature: pose blends - `PoseBlend` drives a switched ragdoll's `JointPoses` toward a named pose by a weight.
# Bare, this scene shows three figures standing: a mannequin (skinned), a voxel ragdoll and a voxel ragdoll
# beside a wall, whose torso the driver pins to the `stake`. The game half is
# `crates/ludion-testkit/tests/common/mod.rs` (`pose_blend_builder`): it switches all three to ragdolls,
# gives every jointed part a `curl` pose and ramps each group's `PoseBlend.weight` 0 -> 1 -> 0
# (`ludion docs physics-joints`, "Pose blends"). Entity positions are pinned by the constants there.
format: 1
name: "ragdoll-pose-blend - skinned, voxel and wall-pinned ragdolls curl under PoseBlend"
seed: 1
physics:
  space: free
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.0
          - 5.0
        rotation:
          - -2.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: key-light
    components:
      Transform:
        translation:
          - 1.0
          - 3.5
          - 3.0
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 3.0
        range: 20.0
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.5
          - 0.0
        scale:
          - 8.0
          - 1.0
          - 8.0
      Mesh:
        shape: cube
        color:
          - 0.55
          - 0.57
          - 0.6
          - 1.0
      Collider:
        shape:
          box:
            half_extents:
              - 4.0
              - 0.5
              - 4.0
        body: static
  - name: wall
    components:
      Transform:
        translation:
          - 0.0
          - 1.0
          - -0.75
        scale:
          - 6.0
          - 2.0
          - 0.5
      Mesh:
        shape: cube
        color:
          - 0.45
          - 0.47
          - 0.52
          - 1.0
      Collider:
        shape:
          box:
            half_extents:
              - 3.0
              - 1.0
              - 0.25
        body: static
  - name: stake
    components:
      Transform:
        translation:
          - 1.5
          - 0.5
          - -0.375
      Collider:
        shape:
          sphere:
            radius: 0.0625
        body: static
  - name: skin
    components:
      Transform:
        translation:
          - -1.5
          - 0.0
          - 0.0
      Mesh:
        shape:
          character: characters/mannequin.character.yaml
        color:
          - 0.6
          - 0.45
          - 0.35
          - 1.0
        roughness: 0.8
      Animation:
        clip: idle
  - name: figure
    components:
      Transform:
        translation:
          - -0.5
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/ragdoll.assembly.yaml
  - name: pinned-figure
    components:
      Transform:
        translation:
          - 1.0
          - 0.0
          - -0.375
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/ragdoll.assembly.yaml
