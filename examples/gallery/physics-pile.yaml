# Feature: rigid-body physics (`ludion-physics`, Plan/physics.md) — a chaotic pile the gallery
# renders at rest.
#
# The gallery's render harness ticks the built-in registry only (`check -> instantiate -> tick(0)
# -> extract -> render`), which now includes this scene's own `physics:` block — but `tick(0)` runs
# no tick, so this golden still shows the authored lattice exactly as written, not a simulated
# topple. The simulated trace lives beside this file (`physics-pile.trace.txt`), produced by
# `ludion-engine`'s `physics_gallery` test, which loads this scene under a bare `Engine::builder()`
# (the `physics: space: free` block below is the only opt-in there is) and steps it for real.
#
# A static box floor plus 64 rigid box bodies in a 4x4x4 lattice, each nudged off-grid and tilted by
# an offset derived from its own index, with a small distinct initial angular velocity. Every offset
# is a dyadic rational (denominator a power of two), so translations, rotations and angular
# velocities are exact in binary and the scene text carries no floating-point authoring artifact.
# The off-grid jitter — and the initial interpenetration it causes between some neighbors — is what
# keeps the simulated pile from settling into a symmetric, quickly-sleeping stack.
