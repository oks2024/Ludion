# particles-stress - the fill-rate stress scene: ~24,000 live particles across twenty endless
# emitters, mixed alpha and additive so the per-frame depth sort and the `scene` pass overdraw are
# both exercised (`Plan/particles-engine-and-editor.md` decision 9).
#
# Sized off a game's typical particle consumers rather than a round number: an ambient plume, a
# drifting mote field and a hit burst are each a single endless or short-burst emitter at a few
# dozen to a couple hundred live particles. This scene multiplies that population by an order of
# magnitude and spreads it across three registers, so the workload has the mixed shape a busy
# level would actually author rather than one emitter type maxed out alone.
#
# Three registers - seven smoke columns, seven ember fountains, six mote drifts, twenty emitters
# total - each endless (`duration: 0`, no `started`) and therefore in steady state at frame 0: the
# live count of an endless emitter is `rate x mean(life)` (`ludion docs particles`):
#
#   SMOKE  (alpha)     7 x rate 380 x life~2.8s ~= 1,064 live each ~= 7,448 total. The overdraw
#          register, deliberately the largest discs (start_size 1.2 -> end_size 3.8, softness
#          0.88): large soft alpha discs at 1080p are fill-bound, and this is where the `scene`
#          pass ceiling shows it.
#   EMBERS (additive)  7 x rate 830 x life~1.4s ~= 1,162 live each ~= 8,134 total. The cheap
#          register: small HDR orange sparks (start_color channel above 1.0) thrown up by positive
#          gravity, additive so a stack of them blows out and rides the bloom chain instead of
#          costing raster fill.
#   MOTES  (additive)  6 x rate 390 x life~3.6s ~= 1,404 live each ~= 8,424 total. Tiny green
#          motes released across a disc and `floor`-clipped at the ground - the highest live count
#          per emitter, carried by the smallest discs.
#
# 24,006 total (~24,000), no single emitter above ~1,500 live - well under
# `PARTICLE_MAX_LIVE_PER_EMITTER` = 4,096. Registers are interleaved position-by-position across
# the floor rather than grouped, so the depth sort actually alternates blend modes frame to frame
# the way a real district's mixed effects would, instead of sorting one flat blend after another.
#
# Placement is deterministic (baked in here by hand, not generated), so this file IS the fixture -
# editing a number by hand is a legitimate edit and no generator run is part of any gate.
#
# Deliberately carries NO `Environment`, `PostProcess` or `DirectionalLight`: the budgets
# calibrated on it (`budgets/pinned-*-particles-stress.toml`, measured on the pinned boxes) exist
# to gate the `scene` pass's particle draw and `extract_ms` alone, and every absent feature is one
# fewer cost mixed into those ceilings - the same rule and the same reason as `lights-stress.yaml`.
