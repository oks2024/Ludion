# Feature: `UiShape` filled `polygon` (Plan/ui-hud.md W3c-1): an ear-clipped simple polygon with a one-pixel
# feathered fringe, drawn by `ui_polygon.wgsl`. Over a dark backdrop, in canvas units:
# - A concave ten-point star.
# - A radar cone fan: an apex plus an arc of points.
# - A concave arrow in a scaled, half-opaque group turned 20 degrees, cut by a rect clip.
# - A bow-tie, which self-intersects and draws nothing.
format: 1
name: "ui-polygons - concave star, radar cone, a clipped group and a degenerate bow-tie"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 5.0
      Camera: {}
  - name: backdrop
    components:
      UiRect:
        fill: true
        color:
          - 0.06
          - 0.07
          - 0.1
          - 1.0
        order: 0
  - name: clip-group
    components:
      UiGroup:
        offset:
          - 1100.0
          - 560.0
        size:
          - 500.0
          - 360.0
        scale: 0.8
        opacity: 0.5
        rotation: 20.0
        clip: rect
  - name: clip-group-frame
    components:
      UiRect:
        fill_group: true
        group:
          index: 2
          generation: 0
        color:
          - 0.15
          - 0.2
          - 0.3
          - 1.0
        order: 1
  - name: star
    components:
      UiShape:
        offset:
          - 330.0
          - 330.0
        shape:
          type: polygon
          points:
            - - 0.0
              - -200.0
            - - 50.0
              - -68.8
