              - 85.0
            - - -117.6
              - 161.8
            - - -80.8
              - 26.3
            - - -190.2
              - -61.8
            - - -50.0
              - -68.8
        fill:
          - 0.95
          - 0.75
          - 0.2
          - 1.0
        order: 1
  - name: radar-cone
    components:
      UiShape:
        offset:
          - 900.0
          - 420.0
