# Feature: Visibility - hide an entity tree, or keep it on screen without shadows. Left to right: (a) a
# normal crate, lit and casting a sun shadow; (b) the same crate with cast_shadows: false, lit and
# present but leaving no shadow; (c) a hidden tree (pillar, ball and a shadowed warm lamp): nothing
# is drawn, no shadow falls and no light pool lands on the floor; (d) a visible root whose ball part is
# hidden, so the pillar draws and shadows alone. A sun keeps every shadow readable. Hiding folds by AND
# down the Parent chain, so a hidden root always wins. Plan/gpu-driven-culling.md decisions.
format: 1
name: "visibility - Visibility: hidden tree, cast_shadows off, one hidden part"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.6
          - 10.5
        rotation:
          - -10.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 48.0
  - name: sun
    components:
      Transform: {}
      DirectionalLight:
        direction:
          - 0.6
          - -0.7
          - -0.2
        color:
          - 1.0
          - 0.96
          - 0.86
        intensity: 2.2
  - name: floor
    components:
      Transform:
        scale:
          - 24.0
          - 1.0
          - 14.0
      Mesh:
        shape: plane
        color:
          - 0.5
          - 0.48
          - 0.45
          - 1.0
        roughness: 0.85
  - name: crate-normal
    components:
      Transform:
        translation:
          - -6.0
          - 0.8
          - 0.0
        scale:
          - 1.6
          - 1.6
          - 1.6
      Mesh:
        shape: cube
        color:
          - 0.8
          - 0.62
          - 0.4
          - 1.0
  - name: crate-shadowless
    components:
      Transform:
        translation:
          - -2.0
          - 0.8
          - 0.0
        scale:
          - 1.6
          - 1.6
          - 1.6
      Mesh:
        shape: cube
        color:
          - 0.8
          - 0.62
          - 0.4
          - 1.0
      Visibility:
        cast_shadows: false
  - name: tree-hidden
    components:
      Transform:
        translation:
          - 2.0
          - 0.0
          - 0.0
      Visibility:
        visible: false
  - name: tree-hidden-pillar
    components:
      Parent:
        index: 5
        generation: 0
      Transform:
        translation:
          - 0.0
          - 1.2
          - 0.0
        scale:
          - 0.9
          - 2.4
          - 0.9
      Mesh:
        shape: cube
        color:
          - 0.3
          - 0.6
          - 0.9
          - 1.0
  - name: tree-hidden-ball
    components:
      Parent:
        index: 5
        generation: 0
      Transform:
        translation:
          - 1.3
          - 0.6
          - 0.6
        scale:
          - 1.2
          - 1.2
          - 1.2
      Mesh:
        shape: sphere
        color:
          - 0.9
          - 0.3
          - 0.3
          - 1.0
  - name: tree-hidden-lamp
    components:
      Parent:
        index: 5
        generation: 0
      Transform:
        translation:
          - 0.0
          - 3.0
          - 1.8
      PointLight:
        color:
          - 1.0
          - 0.7
          - 0.35
        intensity: 14.0
        range: 8.0
        cast_shadows: true
  - name: tree-part
    components:
      Transform:
        translation:
          - 6.0
          - 0.0
          - 0.0
  - name: tree-part-pillar
    components:
      Parent:
        index: 9
        generation: 0
      Transform:
        translation:
          - 0.0
          - 1.2
          - 0.0
        scale:
          - 0.9
          - 2.4
          - 0.9
      Mesh:
        shape: cube
        color:
          - 0.3
          - 0.6
          - 0.9
          - 1.0
  - name: tree-part-ball
    components:
      Parent:
        index: 9
        generation: 0
      Transform:
        translation:
          - 1.3
          - 0.6
          - 0.6
        scale:
          - 1.2
          - 1.2
          - 1.2
      Mesh:
        shape: sphere
        color:
          - 0.9
          - 0.3
          - 0.3
          - 1.0
      Visibility:
        visible: false
