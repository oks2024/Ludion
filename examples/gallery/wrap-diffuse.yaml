        scale:
          - 2.0
          - 2.0
          - 2.0
      Mesh:
        shape: sphere
        color:
          - 0.85
          - 0.85
          - 0.85
          - 1.0
        wrap: 1
      Visibility:
        cast_shadows: false
  - name: a-scatter
