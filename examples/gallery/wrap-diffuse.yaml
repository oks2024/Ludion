        translation:
          - 0.0
          - -2.0
          - 0.0
        scale:
          - 2.0
          - 2.0
          - 2.0
      Mesh:
        shape: sphere
        color:
          - 0.85
          - 0.85
          - 0.85
          - 1.0
        wrap: 0.5
      Visibility:
