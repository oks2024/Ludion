# Not a single-feature demo: this is the milestone's composed preview scene (a Breakout-style
# brick/paddle/ball layout, seen through an orthographic camera) used as a content-rich fixture for
# determinism / record-replay stress testing (see TESTING.md section 2) and as its own golden. For
# isolated single-component demos, see the other gallery scenes.
