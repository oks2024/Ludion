# Feature: Materials — a 6x6 roughness x metallic sweep of spheres, driven purely by the Mesh
# component fields: roughness 0->1 across the columns (smooth left -> matte right), metallic
# 0->1 down the rows (dielectric top -> metal bottom), one warm-gold albedo held constant so
# only the material varies. A ground plane grounds them; the emissive-glass/metallic-trim voxel
# beacon (voxels/beacon.voxel.yaml) exercises palette material fields and blooms through the HDR
# pipeline; a warm key + cool fill place the highlights and the bloom legibly. Phase 11 PBR gate.
