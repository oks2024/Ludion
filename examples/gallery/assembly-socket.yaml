# Feature: part sockets on a voxel assembly (`ludion docs voxel-assemblies`, "Sockets on parts"). Two
# humanoids rendered at frame 30: on the left one playing `walk` carries an emissive cube (a flashlight)
# socketed to `lower-arm-r`, which rides the arm's drawn swing; on the right one at rest wears a cube on
# `head`. A socket's frame is the part's pivot, in voxel units, under the assembly's 0.125 scale.
format: 1
name: assembly-socket - a flashlight on a walking arm and a cube on a resting head
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.0
          - 6.0
        rotation:
          - -2.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 40.0
  - name: key-light
    components:
      Transform:
        translation:
          - 1.5
          - 3.5
          - 4.5
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 5.0
        range: 24.0
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.5
          - 0.0
        scale:
          - 6.0
          - 1.0
          - 4.0
      Mesh:
        shape: cube
        color:
          - 0.55
          - 0.57
          - 0.6
          - 1.0
  - name: walker
    components:
      Transform:
        translation:
          - -1.0
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: walk
  - name: flashlight
    components:
      Transform:
        translation:
          - 0.0
          - -4.0
          - 0.0
        scale:
          - 1.0
          - 3.0
          - 1.0
      Parent:
        index: 3
        generation: 0
      ParentJoint:
        joint: lower-arm-r
      Mesh:
        shape: cube
        color:
          - 1.0
          - 0.9
          - 0.5
          - 1.0
        emissive: 4.0
  - name: idler
    components:
      Transform:
        translation:
          - 1.0
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
  - name: hat
    components:
      Transform:
        translation:
          - 0.0
          - 3.0
          - 0.0
        scale:
          - 3.0
          - 2.0
          - 3.0
      Parent:
        index: 5
        generation: 0
      ParentJoint:
        joint: head
      Mesh:
        shape: cube
        color:
          - 0.8
          - 0.2
          - 0.3
          - 1.0
