# Feature: `UiShape` `dash` (Plan/ui-hud.md W3c-3), a dash pattern along any stroke, in canvas units:
# - Dashes on a circle, ring, partial wedge, arc and rounded rect, and a round-capped dashed line.
# - A dashed closed polyline, a polygon with fill, and radar-style range arcs.
# - `off: 0` beside its undashed twin: the two draw alike.
# - A scaled, turned group whose clip cuts dashed shapes.
format: 1
name: "ui-dashes - dashed strokes on every shape kind, round caps, radar arcs and a clipped group"
