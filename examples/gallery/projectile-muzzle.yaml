# Feature: projectile muzzle convergence — a shot simulated from the eye draws from the gun's muzzle
# and converges onto its true path over the first 4 m, so the stream meets the crosshair line. This
# file is the static scene (no shots); the driven golden `projectile-muzzle-shot` fires them
# (`ludion docs viewmodel`).
format: 1
name: projectile-muzzle - shots leave the viewmodel muzzle and meet the crosshair line
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.6
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 70.0
      CameraRig:
        target:
          index: 1
          generation: 0
        rig:
          mode:
            first_person: {}
      ViewmodelLens: {}
      PostProcess:
        bloom_strength: 0.35
        bloom_threshold: 1.0
  - name: hero
    components:
      Transform: {}
  - name: sun
    components:
      Transform: {}
      DirectionalLight:
        direction:
          - 0.4
          - -0.7
          - -0.5
        color:
          - 1.0
          - 0.96
          - 0.88
        intensity: 2.4
  - name: lamp
    components:
      Transform:
        translation:
          - 0.6
          - 2.4
          - 0.8
      PointLight:
        color:
          - 1.0
          - 0.85
          - 0.6
        intensity: 2.0
        range: 8.0
  - name: ground
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - -10.0
        scale:
          - 40.0
          - 1.0
          - 40.0
      Mesh:
        shape: plane
        color:
          - 0.42
          - 0.46
          - 0.4
          - 1.0
        roughness: 0.9
  - name: wall
    components:
      Transform:
        translation:
          - 0.0
          - 3.0
          - -14.0
        scale:
          - 24.0
          - 6.0
          - 0.5
      Mesh:
        shape: cube
        color:
          - 0.62
          - 0.34
          - 0.3
          - 1.0
        roughness: 0.7
  - name: crosshair
    components:
      UiRect:
        anchor: center
        size:
          - 6.0
          - 6.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 0.9
        order: 1
  - name: gun
    presentation: true
    components:
      Parent:
        index: 0
        generation: 0
      Transform:
        translation:
          - 0.22
          - -0.18
          - -0.45
        scale:
          - 0.08
          - 0.08
          - 0.45
      Mesh:
        shape: cube
        color:
          - 0.1
          - 0.9
          - 0.35
          - 1.0
        roughness: 0.4
      Viewmodel: {}
  - name: muzzle
    presentation: true
    components:
      Parent:
        index: 0
        generation: 0
      Transform:
        translation:
          - 0.22
          - -0.18
          - -0.72
      Viewmodel: {}
