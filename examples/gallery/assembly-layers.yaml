# Feature: animation layers and blend spaces on a voxel assembly (`ludion docs animation-layers`). One
# humanoid, five figures left to right, rendered at frame 60: (1) the `locomotion` blend at params [1, 0]
# (idle toward walk); (2) the same blend at [3.5, 0] (walk toward run); (3) `walk` with a `carry` override
# on the `upper_body` mask, mid-fade (weight about 0.5); (4) `walk` with an additive `lean` at weight 0.7;
# (5) `walk` with a layer naming the `locomotion` blend at layer params [4, 0] on `upper_body`.
format: 1
name: "assembly-layers - a locomotion blend, a mid-fade carry layer, an additive lean and a layer blend"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.0
          - 8.0
        rotation:
          - -2.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 40.0
  - name: key-light
    components:
      Transform:
        translation:
          - 1.5
          - 3.5
          - 4.5
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 5.0
        range: 24.0
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.5
          - 0.0
        scale:
          - 11.0
          - 1.0
          - 4.0
      Mesh:
        shape: cube
        color:
          - 0.55
          - 0.57
          - 0.6
          - 1.0
  - name: blend-idle-walk
    components:
      Transform:
        translation:
          - -3.7
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: locomotion
        params:
          - 1.0
          - 0.0
  - name: blend-walk-run
    components:
      Transform:
        translation:
          - -2.1
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: locomotion
        params:
          - 3.5
          - 0.0
  - name: carry-mid-fade
    components:
      Transform:
        translation:
          - -0.5
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: walk
      AnimationLayers:
        layers:
          - name: carry
            clip: carry
            mask: upper_body
            weight: 1.0
            changed: 45
            fade: 0.5
  - name: additive-lean
    components:
      Transform:
        translation:
          - 1.1
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: walk
      AnimationLayers:
        layers:
          - name: lean
            clip: lean
            mode: additive
            weight: 0.7
  - name: layer-blend
    components:
      Transform:
        translation:
          - 2.7
          - 0.0
          - 0.0
        scale:
          - 0.125
          - 0.125
          - 0.125
      Mesh:
        shape:
          assembly: voxels/humanoid.assembly.yaml
      Animation:
        clip: walk
      AnimationLayers:
        layers:
          - name: pace
            clip: locomotion
            mask: upper_body
            weight: 1.0
            params:
              - 4.0
              - 0.0
