# Feature: localization — keyed UiText resolved from the folder's `kind: strings` tables
# (`strings/en.yaml`, `strings/fr.yaml`), over a minimal lit world like ui-fonts.yaml.
#
# - The title is keyed `menu.title` in `pixel` (Silkscreen): under `fr` the folder's `fonts.yaml`
#   swaps `pixel` for Inter, so the accent in "Paramètres" has a glyph.
# - Two `body` (Inter) lines: a plain key and one with a `{percent}` argument.
# - Bare render: `localization.png` is the default locale (`en`); `ludion render --locale fr` and
#   the `localization-fr` golden (a hand-written test) render the same scene in French.
format: 1
name: "localization - keyed UiText in en and fr, with a per-locale face"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.4
          - 7.0
        rotation:
          - -12.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: ground
    components:
      Transform:
        scale:
          - 12.0
          - 1.0
          - 12.0
      Mesh:
        shape: plane
        color:
          - 0.3
          - 0.32
          - 0.36
          - 1.0
        roughness: 0.85
  - name: key-light
    components:
      Transform:
        translation:
          - 2.0
          - 4.5
          - 4.0
      PointLight:
        color:
          - 1.0
          - 0.96
          - 0.9
        intensity: 5.0
        range: 20.0
  - name: title
    components:
      UiText:
        anchor: top_left
        offset:
          - 24.0
          - 12.0
        text: SETTINGS
        size: 60.0
        color:
          - 1.0
          - 0.85
          - 0.4
          - 1.0
        font: pixel
        order: 0
        key: menu.title
  - name: subtitles
    components:
      UiText:
        anchor: top_left
        offset:
          - 24.0
          - 120.0
        text: "Subtitles: on"
        size: 36.0
        color:
          - 0.95
          - 0.93
          - 0.85
          - 1.0
        font: body
        order: 0
        key: menu.subtitles
  - name: volume
    components:
      UiText:
        anchor: top_left
        offset:
          - 24.0
          - 180.0
        text: "Volume: 80%"
        size: 36.0
        color:
          - 0.75
          - 0.85
          - 1.0
          - 1.0
        font: body
        order: 0
        key: menu.volume
        args:
          percent: "80"
