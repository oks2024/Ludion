# Feature: Mesh with an authored voxel model — `shape: { voxel: "voxels/lantern.voxel.yaml" }`. Each
# voxel model is a strict-YAML `voxels/*.voxel.yaml` grid greedily meshed at load into per-quad
# palette-colored geometry (bottom-centered origin, 1 voxel = 1 unit, sized by `Transform.scale`).
# The warm-glass/bronze lantern shows palette variety; the two trees are the SAME model referenced
# twice (dedup → one mesh upload). A built-in `Mesh` plane grounds them for scale, lit by a warm key
# and a cool fill that flatter the palettes. Proves agent-authored voxel models render (Plan/phase-10,
# Wave 4).
format: 1
name: "voxel-model - Mesh: shape voxel (authored lantern + trees)"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 3.2
          - 8.5
        rotation:
          - -15.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: ground
    components:
      Transform:
        scale:
          - 16.0
          - 1.0
          - 16.0
      Mesh:
        shape: plane
        color:
          - 0.5
          - 0.55
          - 0.6
          - 1.0
  - name: lantern
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 0.0
        scale:
          - 0.35
          - 0.35
          - 0.35
      Mesh:
        shape:
          voxel: voxels/lantern.voxel.yaml
  - name: tree-left
    components:
      Transform:
        translation:
          - -3.0
          - 0.0
          - -0.5
        scale:
          - 0.45
          - 0.45
          - 0.45
      Mesh:
        shape:
          voxel: voxels/tree.voxel.yaml
  - name: tree-right
    components:
      Transform:
        translation:
          - 3.0
          - 0.0
          - -0.5
        scale:
          - 0.45
          - 0.45
          - 0.45
      Mesh:
        shape:
          voxel: voxels/tree.voxel.yaml
  - name: key-light
    components:
      Transform:
        translation:
          - 0.0
          - 2.5
          - 2.5
      PointLight:
        color:
          - 1.0
          - 0.8
          - 0.45
        intensity: 7.0
        range: 14.0
  - name: fill-light
    components:
      Transform:
        translation:
          - -4.5
          - 5.0
          - 4.0
      PointLight:
        color:
          - 0.55
          - 0.65
          - 1.0
        intensity: 4.0
        range: 26.0
