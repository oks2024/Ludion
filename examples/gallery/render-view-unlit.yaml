# Feature: a secondary view's own look - the radar room of `render-view-radar`, with the scene's fog and lamp light in
# the main frame, and the radar window flat: `shading: unlit` (albedo only, no light pools), `fog: false`, its own
# `background` colour, and `post: radar-feed`, a `PostProfile` that grades it green. A `scan` `ScreenEffect` runs over
# the view last. The main frame keeps the fog and the lamp.
# ludion docs render-views.
format: 1
name: "render-view-unlit - RenderView: background, unlit shading, no fog and a PostProfile"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 9.0
          - 16.0
        rotation:
          - -32.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: world-post
    components:
      PostProcess:
        fog_density: 0.018
        fog_color:
          - 0.55
          - 0.6
          - 0.7
        fog_start: 8.0
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 6.0
          - 0.0
      DirectionalLight:
        direction:
          - -0.4
          - -0.8
          - -0.4
        color:
          - 1.0
          - 0.95
          - 0.9
        intensity: 1.4
  - name: lamp
    components:
      Transform:
        translation:
          - 0.0
          - 3.0
          - 0.0
      PointLight:
        color:
          - 1.0
          - 0.8
          - 0.55
        intensity: 3.0
        range: 12.0
  - name: floor
    components:
      Transform:
        translation:
          - 0.0
          - -0.1
          - 0.0
        scale:
          - 12.4
          - 0.2
          - 12.4
      Mesh:
        shape: cube
        color:
          - 0.2
          - 0.22
          - 0.26
          - 1.0
        roughness: 0.9
  - name: wall-back
    components:
      Transform:
        translation:
          - 0.0
          - 0.7
          - -6.0
        scale:
          - 12.4
          - 1.4
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-front
    components:
      Transform:
        translation:
          - 0.0
          - 0.7
          - 6.0
        scale:
          - 12.4
          - 1.4
          - 0.4
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-left
    components:
      Transform:
        translation:
          - -6.0
          - 0.7
          - 0.0
        scale:
          - 0.4
          - 1.4
          - 12.0
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: wall-right
    components:
      Transform:
        translation:
          - 6.0
          - 0.7
          - 0.0
        scale:
          - 0.4
          - 1.4
          - 12.0
      Mesh:
        shape: cube
        color:
          - 0.35
          - 0.3
          - 0.28
          - 1.0
        roughness: 0.9
  - name: cover-a
    components:
      Transform:
        translation:
          - -2.5
          - 0.6
          - -1.5
        scale:
          - 2.0
          - 1.2
          - 1.2
      Mesh:
        shape: cube
        color:
          - 0.25
          - 0.45
          - 0.6
          - 1.0
        roughness: 0.9
  - name: cover-b
    components:
      Transform:
        translation:
          - 3.0
          - 0.6
          - 1.5
        scale:
          - 1.2
          - 1.2
          - 2.4
      Mesh:
        shape: cube
        color:
          - 0.6
          - 0.4
          - 0.25
          - 1.0
        roughness: 0.9
  - name: marker
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 1.2
      GroundMarker:
        shape:
          type: disc
          radius: 1.6
        color:
          - 1.6
          - 0.2
          - 0.1
          - 0.6
  - name: radar-frame
    components:
      UiRect:
        anchor: top_right
        offset:
          - -24.0
          - 24.0
        size:
          - 212.0
          - 212.0
        color:
          - 0.04
          - 0.05
          - 0.07
          - 1.0
        order: 0
  - name: radar-window
    components:
      UiRect:
        anchor: top_right
        offset:
          - -30.0
          - 30.0
        size:
          - 200.0
          - 200.0
        order: 1
        view: radar
  - name: radar-scan
    components:
      ScreenEffect:
        target:
          view: radar
        preset: scan
  - name: radar-cam
    presentation: true
    components:
      Transform:
        translation:
          - 0.0
          - 15.0
          - 0.0
        rotation:
          - -90.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: orthographic
          height: 13.0
      RenderView:
        name: radar
        size:
          - 256
          - 256
        background:
          color:
            - 0.0
            - 0.03
            - 0.01
        shading: unlit
        fog: false
        post: radar-feed
  - name: radar-look
    presentation: true
    components:
      PostProfile:
        name: radar-feed
      PostProcess:
        tonemap: none
        exposure: 1.0
        bloom_strength: 0.0
        gain:
          - 0.4
          - 1.0
          - 0.5
