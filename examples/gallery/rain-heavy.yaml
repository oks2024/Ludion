# Feature: Rain at full cost - the budget scene. A guard hut and yard at night under a sodium spot, a second shadowed
# sodium floodlight, 24 casting cubes ringed around the yard, a coat puddle, SSR and light fog, rained on with every
# Rain field at its default (intensity 1, density 1.5, radius 16, lit, shadowed, backlight 0.6, splashes 1, ripples 1,
# wetness 1) except wind and colour. It is the calibration scene for budgets/pinned-rtx3090-rain-heavy.toml: the
# rain_occlusion map has real casters, the streaks and splashes draw in transparents, the wetness in scene.
# A presentation entity holds the rain, so it never enters the world hash. ludion docs weather.
format: 1
name: "rain-heavy - Rain: every feature on at its default, over casters, a shadowed spot and SSR"
