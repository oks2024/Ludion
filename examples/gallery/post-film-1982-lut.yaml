# post-film-1982-lut - post-film-1982 with its colour grade carried by a baked .cube LUT instead of the analytic
# grade fields (identity here). Regenerate the LUT from a scene that authors the grade:
#   ludion lut bake --scene <scene with the grade> --out grades/film-1982.cube --size 33
# post-film-1982 - the film-lens look for a 1982 neon-noir street: sodium-amber lamps and an emissive
# neon strip under a red-orange halation (`halation_color`) with a faint cool anamorphic streak,
# vignette and static grain. It exercises `halation_color` and the `anamorphic*` fields together.
format: 1
name: post-film-1982 - halation colour and anamorphic streaks on a night street
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.01
          - 0.015
          - 0.04
        sky_horizon:
          - 0.04
          - 0.05
          - 0.09
        sky_ground:
          - 0.006
          - 0.007
          - 0.012
        ibl_intensity: 0.8
      PostProcess:
        bloom_threshold: 0.8
        bloom_strength: 0.08
        exposure: 0.9
        lut:
          path: grades/film-1982.cube
        tonemap: aces
        dither: true
        halation: 0.12
        halation_color:
          - 1.0
          - 0.25
          - 0.08
        anamorphic: 0.08
        vignette: 0.5
        vignette_radius: 0.8
        grain: 0.012
        grain_size: 0.0016
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.2
          - 12.0
        rotation:
          - -4.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
