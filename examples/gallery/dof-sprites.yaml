# Feature: depth of field at a transparent's own distance. A sprite, a particle and a world Text carry
# no depth, so the circle of confusion of each pixel they cover is taken from the transparent itself,
# not from the wall or sky behind it. The camera is focused (focus_distance 11) on the character sprite
# in the middle. What to read in the image: the focus subject and the label beside it stay sharp over a
# defocused ground and wall; the far sprite against the sky is blurred by its own distance; the sprite
# across the wall's top edge is one sharpness above and below it, with no seam; the near sprite is
# defocused and spreads past its own silhouette over what is behind it; the half-transparent sprite
# keeps some of its edge; and the smoke is softened by the distance it is at. No fog, so the layer
# serves depth of field alone.
format: 1
name: dof-sprites - transparents blurred at their own distance
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.05
          - 0.09
          - 0.2
        sky_horizon:
          - 0.32
          - 0.38
          - 0.5
        sky_ground:
          - 0.05
          - 0.06
          - 0.08
        ibl_intensity: 1.0
  - name: post
    components:
      PostProcess:
        bloom_threshold: 1.0
        bloom_strength: 0.08
        exposure: 1.0
        tonemap: aces
        dof: 0.02
        focus_distance: 11.0
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 6.0
          - 20.0
        rotation:
          - -15.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 6.0
          - 0.0
      DirectionalLight:
        direction:
          - 0.3
          - -0.8
          - -0.5
        intensity: 2.4
  - name: ground
