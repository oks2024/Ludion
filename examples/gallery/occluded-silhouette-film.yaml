# Feature: OccludedSilhouette `film` - `film: false` keeps the vignette and grain off the silhouette, in proportion to its opacity.
# Two identical figures half behind cover near the left frame edge, where the vignette is strongest, under the game's slice
# post with the vignette raised to 0.6 and a heavy grain 0.08: (1) the outermost is `film: false`, a clean flat tint; (2)
# its twin is the default `film: true`, darkened by the vignette and grained like the rest of the image. Fill alpha is 0.85.
# ludion docs occluded-silhouette.
format: 1
name: occluded-silhouette-film - film false keeps vignette and grain off an OccludedSilhouette
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.7
          - 14.5
      Camera:
        projection:
          type: perspective
          fov_y_deg: 40.0
      PostProcess:
        exposure: 0.9
        vignette: 0.6
        vignette_radius: 0.6
        grain: 0.08
        grain_size: 0.0015
  - name: sun
    components:
      Transform:
        translation:
          - 0.0
          - 4.0
          - 10.0
      DirectionalLight:
        direction:
          - -0.3
          - -0.6
          - -0.8
        color:
          - 1.0
          - 0.95
          - 0.9
        intensity: 1.6
