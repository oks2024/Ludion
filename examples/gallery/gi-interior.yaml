# Feature: GI wave 1 — baked sky visibility, the calibration scene
# (`Plan/gi-wave1-sky-visibility.md` §9). A sealed room — four walls, a roof, a floor — with one
# open doorway, framed from a back corner so the golden shows exactly three things and nothing
# else: the walls leak no sky, a wedge of sky light lands on the floor at the door, and the back
# corner the camera stands in is dark. There is deliberately no `DirectionalLight`: the only
# large-scale light is the bright sky, so the image IS the `GiVolume`'s product rather than a
# shadow map's.
#
# The torch is emissive and, with `bounce: 1.0` (GI wave 2), lights the room: its own wall pools
# warm and the floor beneath it picks up an orange cast. The mover carries a dim short-range
# `PointLight` and is marked `GiDynamic` (GI wave 3'): its light is injected per frame instead of
# baked — live at the default quality, absent at `low` — and its emissive sphere neither occludes
# the probe rays nor deposits into the voxelization, so it no longer contributes to the static bake
# at all. The back corner's faint blue tint is now the injected term, replaying the bake's own
# cached hits through the mover's current position every frame; the corner stays uncontaminated by
# anything else because leak control is inherited from that same cached hit set, not rebuilt for
# the dynamic term. The mover is kept out of the doorway wedge so it cannot flatter the sky read.
#
# `cell_size`, `probe_spacing` and `normal_bias` were picked off contact sheets, not by taste — see
# `Plan/artifacts/gi-wave1-sweeps.md` and the three `gi-wave1-*.png` sheets beside it.
#
# The only authored `PostProcess` field is a 0.002 `lift`. Bounce now lifts much of the interior on
# its own, but a fully-occluded surface still receives exactly zero ambient: without `lift`, 4.0% of
# the frame's channel samples still sit on the black rail (`clipped_low`, against the 2% ceiling in
# `budgets/image-stats-windows.toml`) — still doing real work, not inert. At `lift: 0` this component
# is byte-identical to authoring none, so the grade is the whole of what it does here.
