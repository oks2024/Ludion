# Feature: AudioZone — ambient beds, reverb and bus gains by where the listener stands. A yard
# (rain bed, outdoor_open) meets a dock (hum bed, hall_medium, ambient bus 0.9) at a doorway; the
# listener marker stands on the yard side. The walk test in tests/audio_mix.rs moves it through
# the door and asserts on audio_mix_at. A free-standing wall hides a chatter emitter.
format: 1
name: "audio-zones - AudioZone: yard, dock and a doorway"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 6.0
          - 34.0
