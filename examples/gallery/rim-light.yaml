# Feature: Mesh.rim and the document-level rim - a view-angle edge that keeps grey figures readable against a dark wall.
# A low-key room: a near-black wall (0.05) behind four mid-grey figures (0.15) under one dim front-side key light, with
# thin fog (`fog_density` 0.03) so the rim is seen riding the medium like emissive. Left to right: a control with no
# rim (it merges into the wall), `voxels/figure.assembly.yaml` with `Mesh.rim` on its entity, a primitive figure whose
# body carries `Mesh.rim` and whose sphere head, arms and legs inherit it down `Parent`, and
# `voxels/rim-figure.voxel.yaml` whose own document-level `rim:` applies with no `Mesh.rim`.
# Rim colour [0.9, 0.8, 0.7], a dim warm neutral: a saturated hue reads as a glow, not an edge.
# `strength` 1.0: swept 0/0.5/1/2 on the assembly figure (`--sweep /entities/10/components/Mesh/rim/strength=0,0.5,1,2`) -
# 0 is the unlit figure, 0.5 is a thin edge that only just separates the arms from the wall, 1 reads clearly on every
# figure, 2 starts to glow off the silhouette.
# `power` 2.0: swept 1.5/2/3/5 (`.../rim/power=1.5,2,3,5`) - 1.5 and 2 give the sphere head a soft ring, 3 and 5 thin the
# edge to the silhouette so the flat cube faces keep only a hairline; 2 keeps the box figures' edges visible.
# The cube faces facing the camera have n.v near 1 and take almost no rim, so the edge sits on side faces and the sphere.
# ludion docs materials.
format: 1
name: "rim-light - Mesh.rim and a document rim keep grey figures readable against a dark wall"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0
          - 1.2
          - 8
      Camera:
        projection:
          type: perspective
          fov_y_deg: 40.0
      PostProcess:
