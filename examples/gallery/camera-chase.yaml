# Feature: the chase camera — a `chase` CameraRig on a hero who walks an open yard past a pillar
# (the boom pulls in), under a low ceiling through two overlapping `CameraZone`s (a wide `follow`
# over a close `chase`), behind a `camera_pass` prop (listed by `camera_occluders`, faded by the
# game) and into a peek corner (`framing`). Bare, this scene shows the authored rig before its
# first tick; the game half is `crates/ludion-testkit/tests/common/mod.rs` (`chase_builder`), which
# walks the hero, sweeps the boom around the yard with `add_look`, writes the peek and fades the
# occluders (`ludion docs camera`). Run `--debug-draw camera` to see the pivot, the boom, the red
# pull-in cross and the active zone.
format: 1
name: "camera-chase - a chase camera pulls in, crosses zones, fades a prop and peeks a corner"
seed: 1
physics:
  space: free
  layers:
    - name: camera_pass
