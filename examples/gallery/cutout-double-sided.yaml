# Feature: Mesh documents with cutout and double-sided materials, under the sun with shafts and SSAO.
# (a) a mask grating raised on four posts: its holes pass the sun, so the floor shadow is a lattice and
# the beams through the fog are striped (alpha_mode mask, the default cutoff 0.5); (b) a double_sided
# flap facing away from the camera, a point light on the camera side: the seen back face is lit as a
# front face would be (the shading frame flips), beside (c) the same quad single-sided, which shows
# nothing from behind; (d) the flap mesh at scale [-1, 1, 1] beside its unmirrored twin, both shaded
# alike with the F mirrored (the mirrored instance keeps its face winding); (e) a distant mask card of
# thin wires (alpha_cutoff 0.4) whose strands stay visible at minified size (coverage-preserving
# mips). Every other field is a default, pinned here by omission. ludion docs materials.
format: 1
name: "cutout-double-sided - Mesh documents: alpha_mode mask, double_sided"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
