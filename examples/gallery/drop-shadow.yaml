# Feature: DropShadow — a projected contact shadow, the depth cue for a character in the air. Each
# caster is a small body with a child at its soles holding the DropShadow; the footprint projects
# straight down onto the first surface at or below the anchor, never the caster's own meshes.
# Left to right, back row: (a) a two-level step, the disc cut at the lip and continuing on the
# lower floor; (b) a thin floating platform, the blob on its top and none on the floor beneath;
# (d) a gentle ramp; (c) a six-metre pit, the blob full strength on its floor. Front row: (e) a
# faded case (max_distance 4, fade_distance 2, soles about 3.4 m up); (f) a GroundMarker
# half-overlapping a blob, the marker reading on top; (g) a segment footprint on a yawed bar.
# No DirectionalLight: the cue needs no sun. Every other field is a default, pinned here by
# omission. Plan/shadow-mapping.md decision 8.
format: 1
name: "drop-shadow - DropShadow: first surface below, ledges, pit, slope, fade, marker, segment"
