# Feature: Rain wetness - the awning hut of rain-awning on a voxel street, rained on at night under one sodium spot.
# Exposed surfaces darken and gloss: the open asphalt (a voxel model, so its palette needs no authoring) is dark and
# mirrors the spot through screen-space reflections, while the ground under the 1.5 m awning stays dry and matte. A
# humanoid voxel assembly stands in the open and is wet; a second stands under the awning and is dry. The coat decal is
# the authored puddle, untouched by wetness. A presentation entity holds the rain, so it never enters the world hash.
# ludion docs weather.
# Ripples and splashes off (ripples: 0.0, splashes: 0.0), so this golden shows the scene still.
# Shadows and backlight off (shadowed: false, backlight: 0.0).
format: 1
name: "rain-wet - Rain wetness: wet open street and figure, dry under the awning"
