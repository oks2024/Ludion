    components:
      Transform:
        translation:
          - 4.4
          - 0.6
          - 0.0
      ParticleEmitter:
        shape: disc
        extent:
          - 2.6
          - 0.0
          - 0.0
        rate: 34.0
        life:
          - 3.0
          - 4.2
        speed:
          - 0.15
          - 0.5
        spread_deg: 90.0
        gravity: 0.35
        drag: 0.6
        floor: 0.05
        start_size: 0.11
        end_size: 0.08
        start_color:
          - 0.4
          - 1.1
          - 0.5
          - 0.7
        end_color:
          - 0.2
          - 0.7
