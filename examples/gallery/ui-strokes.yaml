# Feature: `UiShape` strokes (Plan/ui-hud.md W3c-2): `polygon` `stroke` and the stroke-only `polyline` with
# miter, round and bevel joins, butt and round caps, a feathered one-pixel edge, in canvas units:
# - The three joins on one zigzag, and a 20 degree spike where the miter limit falls back to a bevel.
# - Butt against round caps.
# - A closed polyline, a polygon with fill and stroke, and a stroke-only polygon.
# - A translucent self-crossing polyline and thin 0.5 and 1.0 strokes.
# - A scaled, turned group whose clip cuts a stroke.
