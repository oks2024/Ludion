# Feature: Rain - drops are world-anchored, not carried by the camera. Sparse, wide, cyan streaks on a dark red-brown sky:
# no meshes, no fog, no light, so every bright pixel is one drop. The engine test
# `needs_gpu_drops_stay_world_anchored_when_the_camera_moves` (crates/ludion-engine/tests/rain.rs) loads this scene,
# extracts it at one tick from this camera and from one 2 m to the side, and checks that each fixed world drop lands
# at the pixel the CPU twin (rain_layout, drop_position) projects it to in both renders.
# Ripples, splashes, wetness, lighting, shadows and backlight are all off, so the golden shows streaks and nothing else.
format: 1
name: "rain-camera-move - Rain: sparse cyan drops, world-anchored"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.7
          - 9.0
        rotation:
          - 0.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 50.0
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.03
          - 0.005
          - 0.0
        sky_horizon:
          - 0.03
          - 0.005
          - 0.0
        sky_ground:
          - 0.03
          - 0.005
          - 0.0
        ibl_intensity: 0.0
  - name: weather
    presentation: true
    components:
      Rain:
        density: 0.15
        radius: 8.0
        height:
          - -1.0
          - 4.0
        wind:
          - 0.0
          - 0.0
          - 0.0
        gust: 0.0
        drop_width: 0.05
        streak: 1.0
        color:
          - 0.2
          - 0.8
          - 1.0
          - 1.0
        lit: false
        occlusion: false
        wetness: 0.0
        ripples: 0.0
        splashes: 0.0
        shadowed: false
        backlight: 0.0
