# Feature: a paired action driven by game code (`ludion docs paired-actions`). Bare, this scene shows the
# frame before the action: two motor-driven figures face each other, the instigator (blue) 0.4 m and
# 20 degrees off its aligned pose, the guard (olive) waiting. The game half is
# `crates/ludion-testkit/tests/common/mod.rs` (`takedown_builder`): it fits the action, starts it, warps the
# instigator onto the authored pose, ragdolls the guard on the `quiet` event and gets it up again.
format: 1
name: "paired-takedown - a paired action warps two figures together, then the guard drops and recovers"
seed: 1
