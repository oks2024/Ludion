# Feature: `UiGroup.clip` (Plan/ui-hud.md W4b): a group cuts every descendant's pixels to its box,
# anti-aliased over one pixel, scaled and faded with the group. Three clips over a dark backdrop:
# - Top-left: a `rect` clip at scale 0.8 and opacity 0.5; its orange rect and its text overhang the box
#   and are cut at the edge, the text mid-glyph.
# - Inside it, a nested `circle` group: its cyan rect overhangs the circle and takes both clips (the
#   circle's and the outer rect's), so the part past the circle is gone.
# - Top-right: a `rounded_rect` clip with a `fill_group` frame rect and an overhanging white stripe.
format: 1
name: "ui-groups - UiGroup clip: rect, nested circle and rounded_rect cut their children"
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - 5.0
      Camera: {}
  - name: backdrop
    components:
      UiRect:
        fill: true
        color:
          - 0.06
          - 0.07
          - 0.1
          - 1.0
        order: 0
  - name: clip-rect
    components:
      UiGroup:
        offset:
          - 80.0
          - 80.0
        size:
          - 700.0
          - 420.0
        scale: 0.8
        opacity: 0.5
        clip: rect
  - name: clip-rect-fill
    components:
      UiRect:
        group:
          index: 2
          generation: 0
        offset:
          - -60.0
          - 40.0
        size:
          - 500.0
          - 200.0
        color:
          - 1.0
          - 0.55
          - 0.15
          - 1.0
        order: 1
  - name: clip-rect-text
    components:
      UiText:
        text: CLIPPED TEXT RUNS PAST THE EDGE
        size: 90.0
        offset:
          - 300.0
          - 260.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        group:
          index: 2
          generation: 0
        order: 2
  - name: clip-circle
    components:
      UiGroup:
        anchor: center
        size:
          - 300.0
          - 300.0
        clip: circle
        group:
          index: 2
          generation: 0
  - name: clip-circle-fill
    components:
      UiRect:
        group:
          index: 5
          generation: 0
        offset:
          - -80.0
          - -80.0
        size:
          - 460.0
          - 460.0
        color:
          - 0.2
          - 0.85
          - 0.95
          - 1.0
        order: 3
  - name: clip-rounded
    components:
      UiGroup:
        anchor: top_right
        offset:
          - -80.0
          - 80.0
        size:
          - 700.0
          - 420.0
        clip:
          rounded_rect:
            corner_radius: 70.0
  - name: clip-rounded-frame
    components:
      UiRect:
        fill_group: true
        group:
          index: 7
          generation: 0
        color:
          - 0.25
          - 0.75
          - 0.35
          - 1.0
        order: 1
  - name: clip-rounded-stripe
    components:
      UiRect:
        anchor: center
        size:
          - 900.0
          - 60.0
        group:
          index: 7
          generation: 0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        order: 2
