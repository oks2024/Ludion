# Feature: Viewmodel — a gun parented to a first-person camera draws in its own depth slice, so a wall
# 0.25 in front of the eye never clips it. The barrel pokes through the wall's face; `ViewmodelLens`
# gives the gun its own field of view (`ludion docs camera`).
format: 1
name: "viewmodel-wall - a first-person gun pushed through a wall draws whole"
seed: 1
entities:
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 1.6
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 70.0
      CameraRig:
        target:
          index: 1
          generation: 0
        rig:
          mode:
            first_person: {}
      ViewmodelLens: {}
  - name: hero
    components:
      Transform: {}
  - name: sun
    components:
      Transform: {}
      DirectionalLight:
        direction:
          - 0.4
          - -0.7
          - -0.5
        color:
          - 1.0
          - 0.96
          - 0.88
        intensity: 2.4
  - name: lamp
    components:
      Transform:
        translation:
          - 0.6
          - 2.4
          - 0.8
      PointLight:
        color:
          - 1.0
          - 0.85
          - 0.6
        intensity: 2.0
        range: 8.0
  - name: ground
    components:
      Transform:
        translation:
          - 0.0
          - 0.0
          - -10.0
        scale:
          - 40.0
          - 1.0
          - 40.0
      Mesh:
        shape: plane
        color:
          - 0.42
          - 0.46
          - 0.4
          - 1.0
        roughness: 0.9
  - name: wall
    components:
      Transform:
        translation:
          - 0.0
          - 1.6
          - -1.75
        scale:
          - 4.0
          - 3.0
          - 3.0
      Mesh:
        shape: cube
        color:
          - 0.78
          - 0.3
          - 0.26
          - 1.0
        roughness: 0.7
  - name: gun
    presentation: true
    components:
      Parent:
        index: 0
        generation: 0
      Transform:
        translation:
          - 0.22
          - -0.18
          - -0.45
        scale:
          - 0.08
          - 0.08
          - 0.45
      Mesh:
        shape: cube
        color:
          - 0.1
          - 0.9
          - 0.35
          - 1.0
        roughness: 0.4
      Viewmodel: {}
