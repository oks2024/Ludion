# Hand-painted cobblestone: the cobble layout restyled with flat value bands, painted edge highlights,
# an ink outline in the joints, soft colour drift and a low-detail normal.
# Build:  ludion texture build examples/textures/cobble_painted.texture.yaml --size 512
# Check:  ludion texture check examples/textures/cobble_painted.texture.yaml
format: 1
kind: texture
seed: 5
steps:
  raw_layout:
    op: recipe
    path: std:cobbles
    output: height
    params:
      scale: 4
      gap: 0.06
      bevel: 0.6
      jitter: 0.9
  raw_stone_id:
    op: recipe
    path: std:cobbles
    output: stone_id
    params:
      scale: 4
      gap: 0.06
      bevel: 0.6
      jitter: 0.9
  raw_mask:
    op: recipe
    path: std:cobbles
    output: mask
    params:
      scale: 4
      gap: 0.06
      bevel: 0.6
      jitter: 0.9
  wobble:
    op: noise
    type: gradient
    scale: 4
    octaves: 2
    seed: 9
  layout:
    op: warp
    input: raw_layout
    by: wobble
    amount: 0.05
  stone_id:
    op: warp
    input: raw_stone_id
    by: wobble
    amount: 0.05
  mask:
    op: warp
    input: raw_mask
    by: wobble
    amount: 0.05
  soft_layout:
    op: blur
    input: layout
    radius: 0.01
  bands:
    op: posterize
    input: soft_layout
    steps: 4
  band_tone:
    op: levels
    input: bands
    out_low: 0.2
    out_high: 0.55
  stone_flat:
    op: colorize
    input: stone_id
    stops:
      - at: 0.0
        color: "#4f5a78"
      - at: 0.35
        color: "#6f7a8c"
      - at: 0.7
        color: "#8c9088"
      - at: 1.0
        color: "#a89a78"
  drift:
    op: noise
    type: value
    scale: 3
    octaves: 2
    seed: 12
  drifted:
    op: blend
    a: stone_flat
    b: drift
    mode: overlay
    opacity: 0.3
  banded:
    op: blend
    a: drifted
    b: band_tone
    mode: overlay
    opacity: 0.9
  rim:
    op: band
    input: soft_layout
    level: 0.4
    width: 0.03
    side: inside
    softness: 0.4
  rim_noise:
    op: noise
    type: value
    scale: 9
    octaves: 2
    seed: 14
  rim_broken:
    op: blend
    a: rim
    b: rim_noise
    mode: multiply
    opacity: 0.7
  outline:
    op: band
    input: soft_layout
    level: 0.1
    width: 0.03
    side: both
    softness: 0.3
  joint:
    op: levels
    input: mask
    out_low: 1.0
    out_high: 0.0
  rough_base:
    op: constant
    value: 0.82
  rough_var:
    op: blend
    a: rough_base
    b: drift
    mode: add
    opacity: 0.08
  painted:
    op: layer
    base:
      base_color: banded
      roughness: rough_var
    layers:
      - mask: rim_broken
        opacity: 0.8
        base_color: "#f2e6c8"
      - mask: outline
        base_color: "#241a2e"
      - mask: joint
        base_color: "#241a2e"
        roughness: 0.9
  coarse_relief:
    op: blur
    input: layout
    radius: 0.012
  bumps:
    op: normal_from_height
    input: coarse_relief
    depth: 0.03
  shaded:
    op: ambient_occlusion
    input: coarse_relief
    radius: 0.04
    depth: 0.04
    strength: 0.6
outputs:
  base_color: painted.base_color
  roughness: painted.roughness
  normal: bumps
  occlusion: shaded
  height: coarse_relief
