# Projectile-pattern budget — pinned Apple M4, 1920x1080, release.
#
# Regression tripwires, NOT performance goals. Each measured ceiling below is roughly twice the
# median measured in `--release` on the pinned Apple M4, so a failure means a real, reproducible
# slowdown — never machine noise. All values are milliseconds. Re-calibrate deliberately (a re-bless
# event) if a cost becomes intended and permanent — `ludion explain L4005`.
#
# **One budget file, one calibration scene.** This one is `games/shmup-stress/scenes/steady.yaml`
# — the projectile-pattern arc's stress scene (`Plan/projectile-patterns.md` Wave 2): the standing
# 2,975-bullet field as **closed-form volleys** — four `PatternPlayer`s each firing a ring of 25
# every 4 frames, 119 live `Volley` entities carrying the whole field, every bullet a pure function of
# `(volley, sim time)` evaluated at extract and by the hit query, drawn from one atlas region over the
# same 480-cell `Tilemap` backdrop as its entity twin.
#
# **Its A/B twin is `steady-drawn.yaml`** — the same census as entity-per-bullet, gated by
# `budgets/pinned-apple-m4-sprite-stress.toml`. The two files are read side by side; neither is
# derived from the other, and neither is derived from its RTX 3090 twin
# (`budgets/pinned-rtx3090-shmup-stress.toml`): measured on each box, never copied.
#
# **Checked by the game binary, not by `ludion profile`.** The field is stood up by shmup-stress's
# own schedule, which the CLI driver does not link, so this is the in-process form, from the
# workspace root:
#
#   cargo run --release -p shmup-stress -- --scene games/shmup-stress/scenes/steady.yaml --profile 200 --profile-check budgets/pinned-apple-m4-shmup-stress.toml
#
# MEASURED 2026-09-15 over four 200-frame release runs (30 warmup) at 1920x1080 on 8 sim threads,
# beside the same four runs of `steady-drawn.yaml` (entities):
#
#                    steady (volleys)                     steady-drawn (entities)
#   extract          0.1550 / 0.1514 / 0.1396 / 0.1463    0.7909 / 0.7861 / 0.7874 / 0.7801
#                    median 0.1489                        median 0.7868
#   world_hash       0.1127                               3.79
#   play_patterns    0.0006                               0.0001
#   advance_volleys  0.0020                               0.0001
#   player_hit_test  0.0559 (volley_hits over 119 volleys)  0.0276 (a brute scan of 2,975)
#   frame (sim)      0.0598                               0.1238
#   scene            0.326 (Metal smear, see below)       0.328
#
# The same shape as the 3090's reading, at a faster sim thread: the volley field costs a fifth of
# the entity field's extract and a thirtieth of its hash. `world_hash` is recorded, not gated (paid
# by the offline profiler and replay recording only).
#
# **METAL PER-PASS TIMESTAMPS OVERCOUNT — the `scene` ceiling below is NOT a frame time.** On this
# tile-based GPU every pass timestamp captures the whole overlapping window: `scene` reads 0.326 on
# this scene and 0.328 on the entity twin whose GPU work is the same three draws, where the 3090
# resolves 0.059. It is consistent run-to-run (0.3261 / 0.3261 / 0.3261 / 0.3263), so it still
# trips on a real slowdown in this scene against itself; it is not comparable across boxes.

# The exit line: a 60 fps frame. **A fixed target, not 2x a median** — the sprite budget's posture and
# vigil's E6 `frame_total_ms`. This is the sim schedule alone (0.0598 measured, most of it the hit
# query); `extract_ms` is gated separately below.
# Sim worker count of the measurements below; a report at another count is refused (L4020).
threads = 8
frame_total_ms = 16.6

# The line this file exists for. Every live bullet is evaluated from its closed form at extract on
# the sim thread — origin, angle, the segment walk — then placed and sorted with the sprites, so a
# heavier evaluator steals tick time before any GPU cost shows. Median 0.1489 over the four runs
# above; the ceiling is 0.30, the ~2x posture.
extract_ms = 0.30

# Bullets draw inside `transparents` as sprites (`scene` is the opaque mesh pass since
# `Plan/reflections.md` W1) — one atlas region, 2,975 alpha quads plus the 480-cell backdrop, three
# batched draws. Measured 0.326 under `scene` on the 2026-09-15 runs; `transparents` 0.4365 / 0.4359 /
# 0.4381 / 0.4408 on 2026-10-26 (the smeared Metal reading, see the header); the ceiling is 0.9.
# `reflections` is the sky's full-screen resolve (0.0825–0.0842). `scene` now draws no mesh and Metal
# reads the empty pass as 0.0, which a budget treats as not measured (`L4019`), so it carries no line.
[passes]
reflections = 0.17    # 0.0835 measured (median of four)
transparents = 0.9    # 0.4373 measured (median of four)

# The volley path's three sim lines. `play_patterns` (four players, one ring due each frame) and
# `advance_volleys` (119 live volleys, one reap a frame) sit under 0.01 ms, so they take the flat
# 0.05 floor vigil's E6 gate uses — 2x-of-near-zero still trips on scheduler jitter. The hit query is
# real work (2,975 evaluations against one 0.125 u hitbox): measured 0.0559, ceiling ~2x.
[systems]
play_patterns    = 0.05
advance_volleys  = 0.05
player_hit_test  = 0.11

# Deliberately absent: `composite` and the `bloom` group (pure functions of the output extent and
# already gated on `lights.yaml`); the entity path's `emit_bullets`/`move_bullets` (idle here — they
# are `steady-drawn`'s, and `Plan/bullet-hell-stress.md` holds them uncalibrated); `cluster_build_ms`
# (no light is authored, the panel reads zero).
