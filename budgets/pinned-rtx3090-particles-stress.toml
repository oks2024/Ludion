# Particle budget — pinned RTX 3090, 1920x1080, release.
#
# Regression tripwires, NOT performance goals. Each ceiling below is roughly twice the median
# measured by `ludion profile --scene … --frames 120` in `--release` on the pinned RTX 3090, so a
# failure means a real, reproducible slowdown — never machine noise. All values are milliseconds.
# Re-calibrate deliberately (a re-bless event) if a cost becomes intended and permanent —
# `ludion explain L4005`.
#
# **One budget file, one calibration scene.** This one is `examples/gallery/particles-stress.yaml`
# — the particles arc's stress scene (`Plan/particles-engine-and-editor.md` decision 9): ~22,000
# live particles over a score of endless emitters, alpha and additive mixed so the per-frame sort
# and the overdraw are both exercised, with no `Environment`, `PostProcess` or sun, so what it
# measures is the particle path and nothing else. Checked with:
#
#   ludion profile --scene examples/gallery/particles-stress.yaml --frames 120 --check budgets/pinned-rtx3090-particles-stress.toml
#
# It is a separate file beside `budgets/pinned-rtx3090.toml` (3 lights), `-post-full` (the post
# roster), `-lights-stress` (500 lights) and `-gi-inject-stress` for the reason those are separate
# from each other: every section of a budget is checked against every run, and this scene's
# particle pass (`transparents`) medians 0.90 ms against `lights.yaml`'s 0.001. `ci/teamcity/README.md`'s
# `budgets-windows` configuration runs every file its platform has; a scene a configuration forgets
# to profile is a tripwire disarmed by omission.

# The first `extract_ms` ceiling in the corpus, and the line this file exists for. The particle
# evaluator runs at extract on the sim thread — every live particle is placed from its closed form
# each frame, then the whole population is sorted — so a heavier evaluator steals tick time before
# any GPU cost shows. Checked wherever a report carries an `extract` sequential entry (this offline
# driver and a live `--attach` capture both do).
#
# Decision 9's first trigger is built: `extract_particles` evaluates the emitter list through
# `ludion_core::par` (one emitter a chunk, sequential below 4096 live particles; the list is
# byte-identical at any thread count). Measured 2026-10-10 over four 120-frame release runs at
# 1920x1080, sim.threads 8: 1.134 / 1.106 / 1.345 / 1.124, median **1.129**. The same build at
# `--threads 1` reads 2.898 (the 2026-09-07 sequential reading was 2.446: 2.374 / 2.471 / 2.421 /
# 2.547). The loop test, `cargo test --release -p ludion-engine --lib particle_extract_cost --
# --ignored --nocapture`, reads 3.296 ms @ 1 thread against 1.210 ms @ 8 for 21,829 particles
# (0.0341 / 0.0310 ms for the 219 of `particles.yaml`, which stays sequential). The ceiling is
# 2.5, the ~2x posture, tightened from 5.0.
#
# **Decision 9's second trigger (a stateless vertex-shader evaluation) is reached:** the parallel
# reading, 1.13 ms, still passes the 1 ms line the plan set. Recorded here, not acted on.
extract_ms = 2.5   # 1.129 measured (median of four, 8 threads)

# The particle pass itself: ~22,000 sorted, alpha-and-additive quads at 1080p — fill-bound on the
# large soft alpha particles, which is the scene's expensive register (HDR embers under no bloom are
# the cheap one). Particles draw in `transparents` since `scene` became the opaque pass
# (`Plan/reflections.md` W1); they measured 0.972 under `scene` on the four 2026-10-10 runs.
# Measured 2026-10-27 over four runs: `transparents` 0.9196 / 0.9196 / 0.8735 / 0.853, median
# 0.8965, ceiling 1.8. `scene` is the opaque meshes alone (0.0655 / 0.0655 / 0.0625 / 0.0614, median
# 0.064, ceiling 0.13) and `reflections` the sky's full-screen resolve (median 0.0251, ceiling 0.05).
[passes]
scene = 0.13          # 0.064 measured (median of four)
reflections = 0.05    # 0.0251 measured (median of four)
transparents = 1.8    # 0.8965 measured (median of four)

# Deliberately absent: `composite` and the `bloom` group (pure functions of the output extent and
# already gated on `lights.yaml`), `frame_total_ms` (the CLI links no game systems — 0.001 ms of loop
# overhead) and `[systems]` (none to name). `cluster_build_ms` is not here either: the scene authors
# no lights, so the panel reads zero and would gate nothing.
