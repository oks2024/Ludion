# The scene the output dither was aimed at, and the two platforms agree to 0.0007 on it — a real
# gradient has enough structure that the dither's decision is not a coin flip, which is the contrast
# with `text.png` in the header.
[images."night-sky.png"]
banding_score = 0.3074   # 0.2874
edge_aliasing = 0.7738   # 0.7546

# The volumetric medium's testbed, first blessed on this platform at rev 446. The lowest pair in the
# set on both axes: a night street canyon is almost entirely soft moonlit gradient with few hard
# edges, so there is little for either metric to find. `edge_aliasing` reads exactly 0.0000, the only
# image in the set that does; the ceiling is the shared floor of 0.02 rather than 0.0.
[images."night-street.png"]
banding_score = 0.0384   # 0.0184
edge_aliasing = 0.0200   # 0.0000

[images."occlusion-fade.png"]
banding_score = 0.2406   # 0.2206
edge_aliasing = 1.0000   # 0.9998

# The post-process arc's all-on scene, and the only one authoring the whole `PostProcess` roster
# rather than inheriting the defaults — so its numbers are a statement about the roster composing
# rather than about the engine's shipped imaging. Both entries sit far below the rest of the set for
# reasons the Windows twin records at length and which are properties of the roster, not the GPU:
# the authored `grain: 0.012` genuinely breaks the constant-luma runs banding counts, while the
# aliasing figure is mostly the metric being fooled by the depth of field replacing real detail with
# a gradient. Nothing here anti-aliases. Both agree with the RTX 3090 to within 0.002.
[images."post-full.png"]
banding_score = 0.0934   # 0.0734
edge_aliasing = 0.2306   # 0.2106

# One of the four flat-background images where the dither's stipple decides the metric: 0.3250 here
# against 0.1830 on the 3090. See the header.
[images."sprites.png"]
banding_score = 0.3450   # 0.3250
edge_aliasing = 1.0000   # 1.0000

[images."sun-shadows.png"]
banding_score = 0.3108   # 0.2908
edge_aliasing = 0.9289   # 0.9089

# The header's extreme case: 0.2632 here against 0.0090 on the RTX 3090. A flat background carries no
# gradient to contour, so there is no real banding on either platform — what the metric is reading is
# which way a sub-LSB dither stipple rounded, and the two GPUs disagree on that everywhere at once.
# Aliasing stays fully saturated on both because glyph edges are bare steps, every one.
[images."text.png"]
banding_score = 0.2832   # 0.2632
edge_aliasing = 1.0000   # 1.0000

[images."tilemap.png"]
banding_score = 0.3081   # 0.2881
edge_aliasing = 1.0000   # 0.9959

