# Image-defect baseline — the macOS golden set, measured on the pinned Apple M4 (Metal) at Lore
# rev 446, once the volumetric medium's waves 1-4 and the night moon retune had been blessed here.
#
# Checked with:
#
#   ludion image-stats examples/gallery/goldens/macos/*.png --check budgets/image-stats-macos.toml
#
# The macOS twin of `budgets/image-stats-windows.toml`, and it carries that file's rules verbatim
# because they are properties of the metrics, not of a platform:
#
# - These are regression tripwires, and unlike a profile budget they are a **pure function of
#   committed bytes** — they do not move at all until a golden is re-blessed. So each ceiling sits
#   just above its measured value (measurement + 0.02, clamped at the metric's own 1.0), not at 2x a
#   median. A breach means the image genuinely got worse, never machine noise.
# - All four metrics run higher-is-worse and live in [0, 1]; see `ludion explain L4010` and the
#   `ludion-testkit` topic for what each one counts. Every entry is a ceiling, and an omitted metric
#   is simply not checked.
# - **These are not targets.** A wave that improves an image re-records its entry downward. Relaxing
#   a ceiling upward is a re-calibration event and needs the same justification a golden re-bless
#   does.
# - Like its twin, this file is an arc instrument rather than a CI gate: neither `check.mjs`,
#   `ci.yml` nor `ci/teamcity/` invokes `image-stats --check` on either platform. It is run
#   deliberately by a wave that touches the imaging.
#
# **Why a per-OS file at all, when the two GPUs render the same scenes:** because they do not render
# them to the same bytes, and one metric is sharply sensitive to the difference. Measured across the
# whole set, the M4 and the RTX 3090 agree to within 0.02 of banding on fifteen of nineteen images
# and to within 0.003 of aliasing on all nineteen — the same tiny, uniform cross-GPU drift the
# goldens themselves show. The exceptions are all banding, all on flat-background content, and they
# have one cause: `banding_score` counts the constant-luma runs an 8-bit gradient quantizes into, and
# on a near-flat field the output dither's sub-LSB stipple decides which cells round up. A drift of a
# fraction of an LSB — invisible, and well inside the SSIM the goldens pass at — reshuffles that
# decision wholesale. `text.png` is the extreme case: 0.0090 on the 3090, 0.2632 here, a 29x ratio on
# two images a human cannot tell apart. It is the metric's designed sensitivity landing on content
# with nothing to measure, not a macOS rendering defect, and it is precisely why these numbers are
# keyed per-OS rather than shared.

# Applies to every image. One image in the gallery crushes a channel to black at all — `post-full`,
# at 0.0030, where the authored grade puts a floor of a few blue levels under the moon's shadow bands
# and lets red and green run out from under it. The worst white-clip is `lantern-sheet`'s at 0.0015.
# Both figures match the RTX 3090's exactly: clipping is a property of the authored grade, and the
# cross-GPU drift is far too small to push a channel over a rail.
clipped_low  = 0.0200
clipped_high = 0.0200

# Banding and aliasing are strongly scene-dependent — a flat-background text scene and a sky-gradient
# scene have nothing to say to each other — so each image carries its own pair. The measured value is
# in the comment; the ceiling is that plus 0.02, clamped at 1.0.

[images."billboards.png"]
banding_score = 0.2996   # 0.2796
edge_aliasing = 1.0000   # 0.9932

[images."breakout-mock.png"]
banding_score = 0.3001   # 0.2801
edge_aliasing = 0.9734   # 0.9534

[images."colliders.png"]
banding_score = 0.3144   # 0.2944 (was 0.2950)
edge_aliasing = 0.9737   # 0.9537 (was 0.9689)

[images."lantern-sheet.png"]
banding_score = 0.3278   # 0.3078
edge_aliasing = 1.0000   # 0.9988

[images."lights.png"]
banding_score = 0.2558   # 0.2358
edge_aliasing = 0.9896   # 0.9696

