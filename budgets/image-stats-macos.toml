# --- vigil's districts ---------------------------------------------------------------------------
#
# Recorded here but not checkable by this file, for the reason the Windows twin gives: a district
# scene names vigil's own components, so it renders only through the game registry, which the CLI
# cannot supply. The one figure available without a scratch harness is the committed 960x540
# `district-plaza` golden, re-blessed here at rev 446 (moon retune + medium + `ssao_direct`):
#
#   district-plaza (macOS)    banding 0.0205  edge 0.7857  low 0.0008  high 0.0015
#   district-plaza (Windows)  banding 0.0208  edge 0.7886  low 0.0008  high 0.0015
#
# The two platforms agree to 0.003 on every metric — a district is dense lit geometry with no large
# flat field, so the dither-stipple sensitivity the header describes has nothing to act on. The
# market and cathedral figures in the Windows twin are pre-flip and stale on both platforms; whoever
# rebuilds that harness should measure all three on both.
