# Image-defect baseline — the Windows golden set, re-measured after the post-process arc's defaults
# flip (wave 11: pyramid bloom, AgX, exposure 1.3, output dither on).
#
# Checked with:
#
#   ludion image-stats examples/gallery/goldens/windows/*.png --check budgets/image-stats-windows.toml
#
# These are regression tripwires in the same spirit as `pinned-rtx3090.toml`, with one difference
# that matters: a profile budget's ceiling is calibrated at roughly twice its median because timings
# are noisy, while these numbers are a **pure function of committed bytes** and do not move at all
# until a golden is re-blessed. So each ceiling sits just above its measured value — a breach means
# the image genuinely got worse, never machine noise.
#
# All four metrics run higher-is-worse and live in [0, 1]; see `ludion explain L4010` and the
# `ludion-testkit` topic for what each one counts. Every entry here is a ceiling, and an omitted
# metric is simply not checked.
#
# **These are not targets.** A wave that improves an image re-records its entry downward. Relaxing a
# ceiling upward is a re-calibration event and needs the same justification a golden re-bless does.
#
# **What the flip did to these numbers**, which is the whole reason they are re-recorded here:
# banding collapsed on every scene — the worst in the set went 0.8979 to 0.2867, and the set's mean
# went 0.7189 to 0.2374 — because the output dither is now on by default. Aliasing rose slightly on
# most scenes (mean 0.9299 to 0.9500): AgX is steeper than the ACES fit through the midtones, so a
# luma step across an edge lands further apart in the output, and `edge_aliasing` measures exactly
# that hardness. Nothing here anti-aliases; that is supersampling's job (`render --scale`), which is
# a client quality setting rather than a default.
#
# Per-OS, like the goldens they measure. The macOS twin is `budgets/image-stats-macos.toml`, measured
# on the pinned Apple M4 at Lore rev 446. The two sets agree to within 0.02 of banding on fifteen of
# nineteen images and to within 0.003 of aliasing on all nineteen; the exceptions are all
# flat-background content, where the output dither's sub-LSB stipple — not any visible difference —
# decides the banding score. `text.png` is the extreme: 0.0090 here, 0.2632 there. That sensitivity is
# why these are keyed per-OS and not shared; the macOS file's header records it.

# One image in the gallery crushes a channel to black at all — `post-full`, at 0.0030, where the
# authored grade puts a floor of a few blue levels under the moon's shadow bands and lets red and
# green run out from under it. The worst white-clip is lantern-sheet's at 0.0015 — the exposure went
# to 1.3 at the flip and did not put any scene near its ceiling. Both apply to every image; a scene
# that starts railing channels is worth knowing about wherever it happens.
clipped_low  = 0.0200
clipped_high = 0.0200

# Banding and aliasing are strongly scene-dependent — a flat-background text scene and a sky-gradient
# scene have nothing to say to each other — so each image carries its own pair. The measured value
# and the pre-flip one are in the comment; the ceiling is the measurement plus 0.02, clamped at the
# metric's own 1.0 ceiling.

