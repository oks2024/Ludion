# The post-process arc's all-on scene, and the only one that authors the whole `PostProcess` roster
# rather than inheriting the defaults — so it is the one image in this file whose numbers are a
# statement about the roster composing rather than about the engine's shipped imaging.
#
# Both entries fell a long way when the roster landed, and the two falls are not the same kind of
# thing.
#
# **Banding 0.2097 -> 0.0725 is the effect doing its job.** The scene authors `grain: 0.012`, and
# breaking the constant-luma runs an 8-bit gradient quantizes into is precisely what grain is in the
# roster for; measured on this frame it is 0.2366 with the grain off and 0.0725 with it on. The
# defect is genuinely smaller.
#
# **Aliasing 0.9000 -> 0.2144 is mostly the metric being fooled, and the split is measured.** With
# the defocus off the same frame reads 0.5660, so the depth of field accounts for 0.34 of the fall:
# that is real detail replaced by a gradient — `Plan/post-process-pipeline.md` wave 9 refused to gate
# on this metric for exactly that reason. The remaining 0.15 is the chromatic aberration (0.3695 with
# it off), which displaces red and blue by under a pixel and anti-aliases nothing whatsoever. That is
# the metric gaming the plan's Risks section names, and it is recorded here rather than tuned away:
# the aberration is authored at 0.0008, a quarter of what the component's own docs call a normal
# value, precisely so it stays a lens rather than becoming a cheap way to buy this number.
#
# Nothing here anti-aliases. The scene remains the host for the supersampling gate
# (`ludion-testkit/tests/supersampling.rs`), which switches the defocus, the aberration and the grain
# off at both ends so that it measures the resolve and not them.
# Merging the fog and the shafts into one medium moved this golden and so re-measured both entries,
# by too little to re-cut a ceiling: banding 0.0725 -> 0.0730, aliasing 0.2144 -> 0.2120. The beams
# now march to 3/`fog_density` = 214 units instead of stopping at 30, at a tenth the in-scatter per
# step, which trades a near-camera wash for a longer, fainter one — a redistribution, not a defect.
# Authoring `fog_sky: 1.0` on the scene moved it again by as little: banding 0.0730 -> 0.0725,
# aliasing 0.2120 -> 0.2093. The one entry that moved by a visible fraction is the shared
# `clipped_low`, 0.0018 -> 0.0030 — a sky-coupled haze is darker than the hand-matched horizon slab
# it replaced everywhere except at the horizon itself, so a few more shadow samples reach zero. It
# is still under a sixth of the shared ceiling.
[images."post-full.png"]
banding_score = 0.0925   # 0.0725 (was 0.0730 pre-fog_sky, 0.0725 pre-merge, 0.2097 pre-roster, 0.5740 pre-flip)
edge_aliasing = 0.2344   # 0.2093 (was 0.2120 pre-fog_sky, 0.2144 pre-merge, 0.9000 pre-roster, 0.9171 pre-flip)

