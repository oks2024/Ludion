name: push lane

# A fast subset for every push and pull request: fmt, clippy and the `no-gpu` tests on one Linux
# runner. The full gate set is ci.yml (run on demand) and the private CI; the `no-gpu` profile is
# explained beside the nextest step there.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The scripts need Node >= 21.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # alsa-sys (cpal) needs pkg-config and libasound2-dev; libudev-sys (gilrs) needs libudev-dev.
      - name: Linux system packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: derived imports sync
        run: node scripts/import-sync.mjs

      - name: cargo nextest run
        run: cargo nextest run --workspace --profile no-gpu --no-fail-fast
        env:
          LUDION_FORBID_GPU: '1'
