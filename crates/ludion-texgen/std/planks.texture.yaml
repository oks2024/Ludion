# Planks: boards in staggered rows with a uniform joint between them and a wood-like grain.
#
# Params  columns        boards across the tile
#         rows           board rows down the tile; must be even when stagger is above 0
#         gap            joint width in tile units; 0 is one continuous board, no joint
#         bevel          tile units over which a board rises from its joint to full height; above 0
#         stagger        shift of odd rows in board widths, 0..1
#         stagger_jitter random extra shift of each row in board widths, 0..1
#         grain_scale    grain lines per tile
# Output  boards   0 in a joint rising to 1 at bevel from it; all 1 without a joint
#         board_id a random gray per board, 0 in a joint
#         grain    grain lines along the boards, varied from board to board
#         height   boards with their grain, 0 in the joints
format: 1
kind: texture
seed: 31
params:
  columns: 2
  rows: 6
  gap: 0.008
  bevel: 0.03
  stagger: 0.5
  stagger_jitter: 0
  grain_scale: 14
steps:
  layout:
    op: tile_sampler
    columns: $columns
    rows: $rows
    shape: box
    offset: $stagger
    offset_jitter: $stagger_jitter
    gap: $gap
  joints:
    op: levels
    input: layout
    out_low: 1
    out_high: 0
  boards:
    op: distance
    input: joints
    threshold: 0.5
    max: $bevel
  board_id:
    op: flood_fill
    input: layout
    threshold: 0.5
    output: random
  sway:
    op: noise
    type: value
    scale: 5
    octaves: 3
  lines:
    op: gradient
    axis: v
    shape: triangle
    repeat: $grain_scale
  swayed:
    op: warp
    input: lines
    by: sway
    amount: 0.05
    angle: 90
  grain:
    op: blend
    a: swayed
    b: board_id
    mode: add
    opacity: 0.3
  tone:
    op: levels
    input: grain
    out_low: 0.55
  height:
    op: blend
    a: boards
    b: tone
    mode: multiply
outputs:
  base_color: board_id
  roughness: grain
  height: height
