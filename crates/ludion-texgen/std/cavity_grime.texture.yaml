# Cavity grime: a mask of dirt that settles in the recesses of a height.
#
# Input   height        gray, default 0.5 (a flat height has no cavities, so the mask is empty)
# Params  amount        strength of the grime where it is full, 0..1
#         radius        curvature and occlusion reach in tile units
#         breakup_scale noise cells per tile of the breakup
# Output  cavities      the concave areas, by curvature
#         occlusion     recesses by ambient occlusion
#         mask          cavities and occlusion combined and broken up by noise, 1 where dirty
format: 1
kind: texture
seed: 12
params:
  amount: 0.9
  radius: 0.03
  breakup_scale: 6
steps:
  height:
    op: input
    type: gray
    default: 0.5
  curved:
    op: curvature
    input: height
    radius: $radius
    strength: 4
  cavities:
    op: levels
    input: curved
    in_low: 0.5
    in_high: 0.25
  open:
    op: ambient_occlusion
    input: height
    radius: $radius
    depth: 0.08
    strength: 1
  occlusion:
    op: levels
    input: open
    in_low: 1
    in_high: 0.5
    out_high: $amount
  both:
    op: blend
    a: cavities
    b: occlusion
    mode: max
  noise:
    op: noise
    type: value
    scale: $breakup_scale
    octaves: 4
    seed: 1
  mask:
    op: blend
    a: both
    b: noise
    mode: multiply
    opacity: 0.8
outputs:
  base_color: mask
  roughness: mask
  height: mask
