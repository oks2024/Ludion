# Cobbles: rounded stones set in a grid of gaps, as a height and masks.
#
# Params  scale  stones across the tile
#         gap    cellular edge distance below which the joint is open
#         bevel  cellular edge distance at which a stone reaches full height; above gap
#         jitter how far the stone centers wander from a grid, 0..1
# Output  height   stones domed from the joints, 0 in the joint
#         mask     1 on a stone, 0 in a joint
#         stone_id a random gray per stone, 0 in a joint
format: 1
kind: texture
seed: 21
params:
  scale: 6
  gap: 0.04
  bevel: 0.3
  jitter: 0.85
steps:
  cells:
    op: noise
    type: cellular
    scale: $scale
    return: f2_minus_f1
    jitter: $jitter
  ramp:
    op: levels
    input: cells
    in_low: $gap
    in_high: $bevel
  height:
    op: curve
    input: ramp
    points:
      - x: 0.0
        y: 0.0
      - x: 0.4
        y: 0.7
      - x: 1.0
        y: 1.0
  mask:
    op: levels
    input: ramp
    in_low: 0.0
    in_high: 0.02
  stone_id:
    op: flood_fill
    input: mask
    threshold: 0.5
    output: random
outputs:
  base_color: stone_id
  roughness: stone_id
  height: height
