[package]
name = "ludion-texgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural texture recipes (noise, filters, blends) evaluated into tileable PBR map sets for the Ludion game engine."
keywords = ["ludion", "texture", "procedural", "pbr", "game-engine"]
categories = ["game-engines", "graphics"]

[dependencies]
ludion-core = { path = "../ludion-core", version = "0.1.0" }
ludion-scene = { path = "../ludion-scene", version = "0.1.0" }
png.workspace = true
serde_json.workspace = true

[dev-dependencies]
ludion-assets = { path = "../ludion-assets", version = "0.1.0" }
