# Feature: Reflections W5 - the SSR-over-probes hand-off test of `tests/reflection_parity.rs`
# (`needs_gpu_ssr_over_probes_hands_off_without_a_pop`). Open sky with one sphere probe enclosing a metal floor, a
# chrome sphere and a chrome cube that reflect each other, and four coloured pillars. Face scenes carry no probes, so a
# captured metal holds only the sky fill and the probe path and SSR can agree only under open sky. The test renders it
# probe-only (`--set /entities/0/components/PostProcess/ssr=0`), at `ssr=0.5` and at `ssr=1` (with `ssr_fade` set to
# `[0.9, 1.0]`), and with the cube moved away (`--set /entities/4/components/Transform/translation/1=1000`);
# `tonemap: none` keeps the blend linear in confidence up to the sRGB encoding the test undoes.
# `--debug-view ssr_confidence` marks the confident pixels (R byte 255).
format: 1
name: "reflection-blend-metal - chrome props under open sky with one probe"
entities:
  - name: environment
    components:
      Environment:
        sky_zenith:
          - 0.015
          - 0.028
          - 0.075
        sky_horizon:
          - 0.07
          - 0.1
          - 0.17
        sky_ground:
          - 0.008
          - 0.01
          - 0.018
        ibl_intensity: 1.2
      PostProcess:
        bloom_strength: 0.0
        tonemap: none
        dither: false
        ssr: 1.0
        ssr_fade:
          - 0.45
          - 0.65
  - name: camera
    components:
      Transform:
        translation:
          - 0.0
          - 2.2
          - 6.0
        rotation:
          - -12.0
          - 0.0
          - 0.0
      Camera:
        projection:
          type: perspective
          fov_y_deg: 45.0
  - name: floor
    components:
      Transform:
        translation:
          - 0
          - 0
          - -4
        scale:
          - 60
          - 1
          - 40
      Mesh:
        shape: plane
        color:
          - 0.8
          - 0.8
          - 0.8
          - 1.0
        roughness: 0.05
        metallic: 1.0
  - name: sphere
    components:
      Transform:
        translation:
          - -1.3
          - 0.8
          - -2.5
        scale:
          - 1.6
          - 1.6
          - 1.6
      Mesh:
        shape: sphere
        color:
          - 0.9
          - 0.9
          - 0.9
          - 1.0
        roughness: 0.05
        metallic: 1.0
  - name: cube
    components:
      Transform:
        translation:
          - 1.2
          - 0.6
          - -2.5
        scale:
          - 1.2
          - 1.2
          - 1.2
      Mesh:
        shape: cube
        color:
          - 0.9
          - 0.9
          - 0.9
          - 1.0
        roughness: 0.05
        metallic: 1.0
  - name: probe
    components:
      Transform:
        translation:
          - 0.0
          - 1.5
          - -4.0
      ReflectionProbe:
        shape:
          sphere:
            radius: 14.0
        blend: 0.0
        priority: 0
  - name: pillar-1
    components:
      Transform:
        translation:
          - -4
          - 1.5
          - -6
        scale:
          - 1
          - 3
          - 1
      Mesh:
        shape: cube
        color:
          - 1.0
          - 0.45
          - 0.1
          - 1.0
        roughness: 0.6
        metallic: 0.0
        emissive: 0.6
  - name: pillar-2
    components:
      Transform:
        translation:
          - -0.5
          - 1.5
          - -7
        scale:
          - 1
          - 3
          - 1
      Mesh:
        shape: cube
        color:
          - 0.15
          - 0.5
          - 1.0
          - 1.0
        roughness: 0.6
        metallic: 0.0
        emissive: 0.6
  - name: pillar-3
    components:
      Transform:
        translation:
          - 3.5
          - 1.5
          - -6
        scale:
          - 1
          - 3
          - 1
      Mesh:
        shape: cube
        color:
          - 0.9
          - 0.2
          - 0.5
          - 1.0
        roughness: 0.6
        metallic: 0.0
        emissive: 0.6
  - name: pillar-4
    components:
      Transform:
        translation:
          - 6
          - 1.5
          - -4
        scale:
          - 1
          - 3
          - 1
      Mesh:
        shape: cube
        color:
          - 0.3
          - 0.9
          - 0.4
          - 1.0
        roughness: 0.6
        metallic: 0.0
        emissive: 0.6
