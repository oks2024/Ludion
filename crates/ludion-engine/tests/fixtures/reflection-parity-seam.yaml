        scale:
          - 1.0
          - 3.0
          - 1.0
      Mesh:
        shape: cube
        color:
          - 0.9
          - 0.2
          - 0.5
          - 1.0
        roughness: 0.6
        metallic: 0.0
        emissive: 2.0
  - name: pillar-4
