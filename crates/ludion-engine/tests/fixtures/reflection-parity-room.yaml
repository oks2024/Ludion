# Feature: Reflections parity gate - a closed box room, the SSR-vs-probe half of
# `tests/reflection_parity.rs` (`Plan/reflections.md` decision 27). A metallic floor reflects emissive slats on a
# dark room; one box probe is fitted exactly to the interior, so its walls and floor carry full weight.
# `ssr_fade` is authored (at its default) only so the override pointers resolve. Each image the gate compares is one `ludion render --scene <this file> --width 960 --height 540 --out <png>` away; the floor's
# roughness is the band (`/entities/1/components/Mesh/roughness=0.05|0.2|0.35|0.55`):
#   probe-only: --set /entities/0/components/PostProcess/ssr=0
#   SSR-only:   --set /entities/0/components/PostProcess/ssr=1 --set /entities/0/components/PostProcess/ssr_fade/0=0.9 --set /entities/0/components/PostProcess/ssr_fade/1=1.0
#   mask:       the SSR-only sets plus `--debug-view ssr_confidence`; a pixel is fully confident where its R byte is 255.
format: 1
name: "reflection-parity-room - a closed box room: SSR against its fitted probe"
entities:
