# Ludion project manifest.
#
# The project manifest, read by `ludion export`, `ludion sync`, `ludion dev` and every game host.
# `default_scene` must name the same file as `.default_scene(...)` in `game()` (`L0038`). Tables:
# `[ios]` (the app's identity), `[[import]]` (glTF trees `ludion sync` derives), `[cook]` (texture
# cooking) and `[audio]` (voice caps). See `ludion docs export` and LUDION-GUIDE.md.

name = "{{name}}"
default_scene = "scenes/main.yaml"

[ios]
# Pick your own reverse-DNS id before the first device export, and keep it: a free Apple team
# registers only a few app IDs a week.
bundle_id = "com.example.{{name_bundle}}"
