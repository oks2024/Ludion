    kind: gate
    x: 3.0
    z: 5.0
    components:
      Gate:
        to: target.yaml
        anchor: from-here
  - name: gate-b
    kind: gate
    x: 7.0
    z: 7.0
    components:
      Gate:
        to: target.yaml
        anchor: from-here
