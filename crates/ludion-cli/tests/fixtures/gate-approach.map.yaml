format: 1
kind: map
name: gate-approach
kit: kit.yaml
cell_size: 2.0
origin:
  - 0.0
  - 0.0
rows:
  - "#####"
  - "#.###"
  - "#####"
  - "#...#"
  - "#####"
markers:
  - name: anchor
    kind: torch
    x: 5.0
    z: 7.0
