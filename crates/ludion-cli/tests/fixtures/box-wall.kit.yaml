format: 1
kind: map-kit
name: box-wall-kit
tiles:
  ".":
    - name: floor
      shape: cube
      y: -0.5
      scale:
        - 2.0
        - 1.0
        - 2.0
      merge: true
      collider:
        box:
          - 1.0
          - 0.5
          - 1.0
  "#":
    - name: floor
      shape: cube
      y: -0.5
      scale:
        - 2.0
        - 1.0
        - 2.0
      collider:
        box:
          - 1.0
          - 0.5
          - 1.0
    - name: wall
      shape: cube
      y: 1.0
      scale:
        - 2.0
        - 2.0
        - 2.0
      collider:
        box:
          - 1.0
          - 1.0
          - 1.0
