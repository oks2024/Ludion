[package]
name = "ludion-mesh-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deriving an edited copy of a mesh's texture maps from a mesh-edit document (region algebra, UV rasterisation, paint ops, ray picking) for the Ludion game engine."
keywords = ["ludion", "mesh", "texture", "emissive", "game-engine"]
categories = ["game-engines", "graphics"]

[dependencies]
ludion-assets = { path = "../ludion-assets", version = "0.1.0" }
ludion-core = { path = "../ludion-core", version = "0.1.0" }
ludion-scene = { path = "../ludion-scene", version = "0.1.0" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
