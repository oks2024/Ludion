# Renderer-side denylist, tier `render` (engine-architecture.md §5; scripts/clippy-denylist.mjs).
#
# ludion-renderer is the wgpu HD-2D pipeline: it is NOT on the deterministic sim path, so the sim
# lists on types, math and glam do not apply. The renderer builds view/projection matrices with
# glam's own trig, and may use std hash containers in GPU glue. Cross-process determinism of the
# rendered PNG is a property of running the same code on the same adapter on one machine, not of the
# sim-determinism rules.
#
# The clock is banned: rendering reads no wall time. The one exception is the presenter thread
# (src/presenter.rs), which times its own swapchain waits against the display and carries a scoped
# allow; nothing it reads reaches the sim. The second is the probe store's hit stamp
# (src/probe_store.rs `stamp_used`): a short-lived thread reads `SystemTime::now` to refresh an
# entry's last-used mtime; the sim thread never reads a clock.

# ── Generated by scripts/clippy-denylist.mjs: edit the lists there, never below this line. ──

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "no wall clock on the deterministic path; time arrives as SimTime / FrameIndex (ctx.dt / ctx.frame in a system)" },
    { path = "std::time::SystemTime::now", reason = "no wall clock on the deterministic path; time arrives as SimTime / FrameIndex (ctx.dt / ctx.frame in a system)" },
    { path = "std::time::Instant::elapsed", reason = "no wall clock on the deterministic path; time arrives as SimTime / FrameIndex (ctx.dt / ctx.frame in a system)" },
    { path = "std::time::SystemTime::elapsed", reason = "no wall clock on the deterministic path; time arrives as SimTime / FrameIndex (ctx.dt / ctx.frame in a system)" },
]
