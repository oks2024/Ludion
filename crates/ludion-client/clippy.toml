# Permissive transport-side denylist (engine-architecture.md §5).
#
# ludion-client is a synchronous WebSocket SDK — a transport client, NOT on the deterministic sim
# path. The strict sim denylist (no std HashMap, no wall clock) does not apply: it only serializes
# typed commands out and deserializes typed responses in. Determinism is a property of the engine on
# the far side of the wire, never of this crate.
#
# This file is intentionally empty of `disallowed-types` / `disallowed-methods`, matching the other
# transport/host crates: the crate still builds under `cargo clippy -- -D warnings`.
